<script>
const D={
sop:{h:"The standard operating problem",v:"Vol 1 Ch 2",t:"Points do not mean control. The IBJJF scoring system was designed for striking sports — positions score points because they imply the ability to strike. In pure grappling, a guard pass scores 3 points but the passer may have less actual control than they had before. The system conditions everyone to chase positions that score, not positions that genuinely pin."},
core:{h:"Core principle",v:"Vol 1 Ch 3-4",t:"Every athletic movement the bottom player can make — bridge, kip, spin, stand-up — is powered by feet-to-floor contact. Remove that, and you remove their power source. The new wave approach: deny floor contact, control the legs, flatten the opponent, then submit. This is fundamentally different from the standard operating procedure."},
movement:{h:"How movement is created",v:"Vol 1 Ch 3",t:"The bottom player's legs are the engine. If Tyler bridges, the legs drive the hips. If he kips, the legs generate the momentum. If he spins, the legs anchor and pivot. This means: if you control the legs and deny feet-to-floor, every escape attempt is weakened before it starts."},
legctrl:{h:"Leg control tools",v:"Vol 2",t:"Five primary methods: split (divide the legs so they can't work together), ride (maximize weight distribution on legs), turk (counter stand-up attempts from folk wrestling), shelf (cover the hips — Khabib style), rear mount (the ultimate goal — two feet inside with total lower body control)."},
upbody:{h:"Upper body tools",v:"Vol 3",t:"Seven tools: crossface (baseline), claw (prevents elbow return), open elbow (forces arm from body), Dagestani handcuff (wrist ride — best grip), half nelson (turn and flatten), arm-in crossface (reinforced, can submit from here), rear naked control (neck — the most brutal). The goal: open the elbow, break the knee-elbow connection."},
flatten:{h:"Flatten — the rear mount hierarchy",v:"Vol 3 Ch 9",t:"The hierarchy of flattening: two feet inside (best), crab hooks, single hook + diagonal ride, cradle controls, turtle. The rear mount is not just a back-taking position — it's the ultimate form of lower body control. The instructor argues it should be the goal in all combat sports, not just jiu-jitsu."},
sub_arm:{h:"Strangles",v:"Vol 6",t:"Belly down rear naked choke is the strongest finish from leg ride positions — set up with the kabob grip and Dagestani handcuff. Rear Ezekiel comes from a failed arm triangle where the arm ends up inside — becomes a strangle from there."},
sub_lock:{h:"Joint locks",v:"Vol 6",t:"Arm triangle from leg ride positions (turn body away while applying). Cow catcher — high wrist position without a chin strap, applied extremely fast due to wrist lock danger. Kimura with risk management — the wrist lock can cause injury if applied too slowly."},
sub_pos:{h:"Position escalation submissions",v:"Vol 6",t:"Gift wrap — uses pin position threat to reach a more dominant position rather than finishing directly. Half nelson — creates belly-down and back exposure from the pin. Darce — covered legs first (reverse of standard order) which is the key low-risk entry."},
leg_goal:{h:"Leg control — the foundation",v:"Vol 2 Ch 1",t:"The overarching principle: if the opponent on bottom cannot get feet to floor, their bridges are weakened, their kips are compromised, their stand-ups are countered. All five leg controls serve the same goal — deny the feet-to-floor power source."},
split:{h:"Split",v:"Vol 2 Ch 2",t:"Drive your body between the opponent's legs so they cannot work in unison. When legs are together they generate compound force for bridges and kips. Splitting them makes every movement weaker and more predictable — each leg works independently and becomes easier to control separately."},
ride:{h:"Ride",v:"Vol 2 Ch 3",t:"Maximize your weight distribution on the opponent's legs. Simply ride the legs — this can emerge from countless positions. The core: if you maximize weight on their legs, their leg-powered movements (bridges, kips, spins) are working against your weight. Also called 'leg surfing' — you follow their movement rather than fight it."},
turk:{h:"Turk",v:"Vol 2 Ch 4",t:"From folk style wrestling. Used when the opponent tries to stand up. Hook behind their knee as they rise — controls the leg in the standing transition and can be used to trip them back down or transition into other leg controls. Especially relevant against modern grapplers who mix standing passing with guard play."},
shelf:{h:"Shelf",v:"Vol 2 Ch 5",t:"Cover the hips — the Khabib/Dagestani approach. Double leg hook that covers the hip region. Seen extensively in Khabib's MMA game. Built on the folk style idea that covering the hips scores takedown points — here used for positional control rather than scoring. Removes the bottom player's ability to use their hips for power generation."},
rearmnt:{h:"Rear mount",v:"Vol 2 Ch 6",t:"The ultimate goal of all lower body control. Two feet inside with chest to back — the instructor argues this should be the primary goal in all combat sports. Not just a jiu-jitsu back-taking position. From here: every submission is available, every escape is extremely difficult, and the top player controls the pace completely."},
split_d:{h:"Split detail",v:"Vol 2 Ch 2",t:"The split fundamentally breaks leg unison. When you drive between the legs, a bridge attempt now works against itself — one leg pushes in opposition to the other. The split is often the entry to other leg controls like the ride or the shelf."},
ride_d:{h:"Ride detail",v:"Vol 2 Ch 3",t:"Leg surfing — follow the opponent's movement. Don't fight it, go with it and maintain your weight. This is different from the split which is more static. The ride is dynamic — as they move you move with them, maintaining the weight differential that suppresses their power."},
turk_d:{h:"Turk detail",v:"Vol 2 Ch 4",t:"Hook behind the knee as they stand. This can transition into: trip back to the floor, spiral ride, or shelf. The turk is particularly useful against athletic grapplers who try to use standing to reset — it denies the stand-up before it completes."},
shelf_d:{h:"Shelf detail",v:"Vol 2 Ch 5",t:"Double leg hook — your legs cover their hips. This removes hip mobility almost entirely. Combined with upper body tools (Dagestani handcuff, claw) it creates an extremely rigid control position where the opponent can barely create space, let alone escape."},
rear_d:{h:"Rear mount detail",v:"Vol 2 Ch 6",t:"Two feet inside is the best. Single hook plus body weight pressure is second. The hierarchy: two feet inside → one foot inside with diagonal pressure → crab hooks from behind → cradle style controls → turtle position. Each step down the hierarchy still represents a degree of control."},
loop:{h:"Create a loop",v:"Vol 4 Ch 9",t:"The most difficult part of this style is that you need to keep moving. Never stay static in any single control. The loop means: cycle between controls — split to ride to shelf, or ride to turk, or shelf to rear mount. Each transition threatens something different and keeps the opponent unable to time an escape against a predictable position."},
flat:{h:"Opponent flattened — ready to submit",v:"Vol 3",t:"Once the legs are controlled and upper body tools are applied, the opponent is flattened. From flat they have almost no escape power. This is where submissions become available — not from scrambles, but from controlled flat positions where the top player dictates everything."},
ub_goal:{h:"Upper body tools",v:"Vol 3 Ch 1",t:"Having covered how to control the lower body, the next question is the upper body. The tools here work with the leg controls — they're combined, not used independently. The overarching goal: open the opponent's elbow, break the knee-elbow connection, apply pressure to force flattening."},
crossf:{h:"Crossface",v:"Vol 3 Ch 2",t:"The most traditional grip. Press across the face — traditionally used with an underhook for side control and half guard passing. Here used as the baseline upper body tool. Leads naturally to the arm-in crossface variant when the arm gets trapped inside."},
claw:{h:"Claw",v:"Vol 3 Ch 3",t:"Great grip in back-taking scrambles — when diving for the back or in rolling situations. The claw reduces the opponent's ability to bring their elbow back to their chest. Directly attacks the knee-elbow connection. Works well combined with a spiral ride from turtle."},
openelbow:{h:"Open elbow",v:"Vol 3 Ch 4",t:"Build on the claw — the claw reduces elbow return, open elbow forces the arm completely away from the body. This is the key to breaking the defensive position: the knee-elbow connection is the opponent's armor. Once the elbow is open, the armor is gone and flattening becomes much easier."},
dag:{h:"Dagestani handcuff",v:"Vol 3 Ch 5",t:"The best grip. Wrist ride combined with Dagestani handcuff. Special because of the upper body spine twisting pressure it generates. When applied, it creates a spiral rotation in the opponent's spine that they cannot resist with normal defensive positions. Leads directly into belly down rear naked choke entries."},
rnc:{h:"Rear naked control",v:"Vol 3 Ch 8",t:"The neck — described as the most brutal part of the series. An arm around the neck creates tremendous pressure even without the finishing choke. Seen in Khabib's game — that arm around the neck looks almost primitive but creates extraordinary control. Connects to the belly down RNC as the submission."},
crossf_d:{h:"Crossface and arm-in variant",v:"Vol 3 Ch 2 + 7",t:"Standard crossface is the baseline. The arm-in crossface (reinforced crossface) is more powerful — everyone instinctually tries to do this. With the arm inside the crossface grip, you can actually submit people directly from this position without transitioning."},
claw_d:{h:"Claw detail",v:"Vol 3 Ch 3",t:"The claw works particularly well in back-taking scrambles. Combined with a spiral ride from turtle, the claw creates a rotation that the opponent cannot stop with normal defensive movements. The claw's power: it stays connected even as the opponent moves."},
openelbow_d:{h:"Open elbow detail — underclaw",v:"Vol 3 Ch 4 + Vol 4 Ch 7",t:"Open elbow from the front position. The underclaw (from turtle) applies the same open elbow principle from underneath — described as creating brutal pressure. Once the elbow is open and the arm is away from the body, the top player has a clear path to any upper body submission."},
dag_d:{h:"Dagestani handcuff detail",v:"Vol 3 Ch 5",t:"The spine twisting pressure: when the wrist is controlled and the handcuff is applied, the opponent's spine rotates in a direction they cannot generate power from. This naturally flattens them and positions the arm for the belly down rear naked entry. The kabob grip sets up the handcuff."},
rnc_d:{h:"Rear naked control detail",v:"Vol 3 Ch 8",t:"Kabob grip combined with the Dagestani handcuff is the entry sequence. The neck pressure alone is extreme. The belly down rear naked is the primary finish from this control — position the opponent belly down while maintaining the choke grip and the finish becomes very high percentage."},
nelson:{h:"Half nelson",v:"Vol 3 Ch 6",t:"Used to turn people over — the turning tool. In wrestling context: forces the opponent onto their back for a pin. Here: used to create belly-now (belly down) and back exposure. The half nelson combined with leg controls creates a rotation the opponent cannot stop. Also the Vol 6 submission."},
hier:{h:"Rear mount hierarchy",v:"Vol 3 Ch 9",t:"The hierarchy from best to manageable: two feet inside (perfect rear mount — complete control), crab hooks (flaring leg pressure from behind), single hook with diagonal ride pressure, cradle style, turtle. Each level still represents meaningful control — this is not a binary good/bad distinction but a spectrum of control quality."},
flat2:{h:"Flattened — ready to submit",v:"Vol 3-4",t:"Once the leg and upper body tools combine, the opponent is flat. Belly down, back exposed, legs controlled. From here the submission options open up — not as scramble grabs but as controlled attacks from a dominant position where the opponent has almost no escape power."},
turtle_start:{h:"Opponent turtles",v:"Vol 4 Ch 1",t:"When the opponent turtles, the conventional jiu-jitsu response is: get the seatbelt, insert both hooks, look for the back take. This is the standard operating procedure. The new wave approach: remove the two-hook mentality entirely. Prioritize control first. Finding the second hook can wait — and often isn't necessary."},
turtle_princ:{h:"Prioritize control, not the second hook",v:"Vol 4 Ch 1",t:"The second hook mentality causes top players to reach and expose themselves. Instead: use the turtle position as a platform for the same leg controls and upper body tools. Kosoto hook, cradle, diagonal ride — all of these give control from turtle without requiring the second hook."},
kosoto:{h:"Kosoto hook",v:"Vol 4 Ch 2",t:"When you don't have an inside hook yet, use an outside hook (kosoto). This still provides meaningful control — tighter than just having a seatbelt, less than a full single hook. It's a progression step toward complete control, not a failure state. Controls the outside of the leg to prevent certain stand-up and rolling attempts."},
cradle:{h:"Cradle",v:"Vol 4 Ch 3",t:"From front head position with a hook. The cradle style hook is similar to the kosoto — it uses the leg to hook and control without requiring the inside position. Often entered from front headlock scrambles. Useful as a control bridge when transitioning between positions."},
diagride:{h:"Diagonal ride",v:"Vol 4 Ch 4",t:"The best turtle control. A single hook combined with diagonal body pressure — the top player's weight goes across the diagonal of the opponent's body, not straight across. This diagonal pressure is much harder to escape than perpendicular pressure. Remove the point-scoring framework: the diagonal ride gives better control than rushing to the second hook."},
crabhk:{h:"Crab hook",v:"Vol 4 Ch 5",t:"Crab-style hooks from behind. Creates a flaring pressure in the opponent's legs — makes it harder for them to move their legs together for escape movements. An alternative when the inside hook isn't available, with the characteristic feature of flaring (spreading) rather than hooking inward."},
spiral:{h:"Spiral ride",v:"Vol 4 Ch 6",t:"Claw grip combined with a rotation. As the opponent tries to defend, apply the claw and use your body weight in a spiral — the rotation creates pressure they can't counter directly. Applied from turtle to bring the opponent around and down into a flatter position."},
underclaw:{h:"Underclaw from turtle",v:"Vol 4 Ch 7",t:"The underclaw applied from the turtle position — described as extremely brutal. With the arm underhooked and the open elbow principle applied, the pressure on the shoulder and elbow is severe. Forces the opponent to either submit to the pressure or give up the turtle in a way that exposes them to other controls."},
piece:{h:"Piece it all together",v:"Vol 4 Ch 8",t:"All the skills — leg principles, upper body tools, flattening hierarchy, turtle controls — taught in isolation are now combined. The key synthesis: you don't use one tool and stay there. You cycle through the tools (creating the loop) to keep the opponent off-balance and unable to time an escape."},
ent_goal:{h:"Find the leg rides from your game",v:"Vol 5 Ch 1",t:"The instructor's intention: supplement the game you already have. Don't replace your passing or back taking — just learn to recognize the moments where these leg rides and pins naturally emerge from what you already do. Every position you currently use has at least one entry into this system."},
ent_side:{h:"Side control entry",v:"Vol 5 Ch 1",t:"Side control is described as the most overrated position in jiu-jitsu — everyone rushes to get there by the nature of the point scoring system. Instead of sitting in side control, use it as a transition point into leg rides. The split and ride both emerge naturally from side control."},
ent_mount:{h:"Mount entry",v:"Vol 5 Ch 2",t:"Mount is strong but controlling an explosive fresh opponent from mount is difficult. When the opponent tries to escape with explosive bridging, that's the moment to leg ride. As they create movement, follow with the leg ride rather than fighting the movement."},
ent_knee:{h:"Knee ride entry",v:"Vol 5 Ch 3",t:"Knee ride has inversion risk in no-gi — if the bottom player inverts, they can go straight to leg entries. But knee ride can be used as a bridge position into other leg riding styles rather than as a destination. The stand-up attempts from knee ride lead naturally into the turk."},
ent_rear:{h:"Rear mount entry",v:"Vol 5 Ch 4",t:"From back control — when the opponent does a standard escape (falling to one hip to beat the bottom hook), follow that movement into the leg ride. The chair sit back control naturally positions you for leg riding as the escape begins. Follow their movement rather than resist it."},
ent_pass:{h:"Passing entries",v:"Vol 5 Ch 5-8",t:"Leg drag, smash pass, dope mount, body lock — all naturally split or ride the legs as part of the pass mechanics. The leg drag is particularly direct: it creates an immediate split as you drag the leg. Dope mount (BJ Penn's position) uses butterfly hook counters to split the legs."},
ent_side_d:{h:"Side control detail",v:"Vol 5 Ch 1",t:"Don't sit in side control — use it as a bridge. The standard side control is overrated because it doesn't genuinely restrict the athletic bottom player. From side control, immediately look for the split (drive between legs), the ride (load onto legs), or transition to a leg ride that actually denies floor contact."},
ent_mount_d:{h:"Mount detail",v:"Vol 5 Ch 2",t:"Body lock details from mount — the body lock covers the legs while mounted. Dope mount is the direct application: when opponent inserts butterfly hooks to create elevation, hip switch in the air to split the legs. BJ Penn used this extensively in MMA when opponents tried to use butterfly guards to create space."},
ent_knee_d:{h:"Knee ride detail",v:"Vol 5 Ch 3",t:"Use knee ride as a bridge not a destination. The inversion risk means you shouldn't sit here — but the transition moments (as opponent tries to stand or invert) are natural entries to the turk or other leg rides."},
ent_rear_d:{h:"Rear mount detail",v:"Vol 5 Ch 4",t:"Chair sit to back control — when opponent falls to one hip to escape, your leg naturally follows into a leg ride position. Follow their escape attempt rather than resist it. This creates a reactive entry that flows naturally from standard back control defense."},
ent_pass_d:{h:"Leg drag detail",v:"Vol 5 Ch 5",t:"The leg drag is the most natural split entry from passing. As you drag the leg, you're already splitting — the mechanics are the same. Smash pass collapses the legs and forces weight commitment, then you ride from there. All passing entries described as supplements, not replacements for your current passing game."},
ent_final:{h:"Leg ride found",v:"Vol 5",t:"Once in a leg ride from any entry, apply the upper body tools (crossface, claw, Dagestani handcuff) to flatten the opponent. The leg ride alone restricts movement — combined with upper body tools, it restricts movement completely and creates the submission opportunities."},
ent_sub:{h:"Submit or escalate",v:"Vol 5-6",t:"From the flat position, choose the submission based on what's available. The system gives you multiple options so you're never stuck — if the arm triangle is defended, switch to Rear Ezekiel. If the belly down RNC is defended, the Dagestani handcuff creates a different angle."},
sub_start:{h:"Pin position established",v:"Vol 6 Ch 1",t:"The most important section: how the pins lead to submissions. The argument: these aren't positions you hold to score points — they're positions from which submissions become highly available. The control forces the opponent to defend specific things, and those defenses open submissions."},
armt:{h:"Arm triangle",v:"Vol 6 Ch 2",t:"From leg ride positions. The key mechanical detail: turn the opponent's body away from the arm triangle side as long as possible (this maintains the submission pressure), then apply your weight on top to prevent a backwards roll escape. Two elderly training partners used to demonstrate because 'two spines broken is better than mine.'"},
bdrn:{h:"Belly down rear naked",v:"Vol 6 Ch 6",t:"The strongest finish from leg ride positions. Set up via: kabob grip (grip around the neck) plus Dagestani handcuff (wrist control). The kabob grip and handcuff combination naturally positions the opponent for the belly down finish. Also can be used when opponent is in total (turtle) position to encourage them to flatten."},
darce:{h:"Darce",v:"Vol 6 Ch 7",t:"Two high-percentage, low-risk Darce setups. The key insight: reverse the standard order. Standard Darce: establish the arm submission first, then control the legs. New wave: control the legs first, then the arm. This reversal creates lower risk because you're not reaching for the arm while uncontrolled."},
cowc:{h:"Cow catcher",v:"Vol 6 Ch 8",t:"The instructor's current personal favorite. High wrist position (not a chin strap — avoids certain rule sets). Applied from standing position down, or from the pin positions. Must be applied extremely fast — the wrist lock component means if you apply slowly, they have time to tap in a dangerous position. If applied too gently, they can resist."},
armt_d:{h:"Arm triangle detail — Rear Ezekiel",v:"Vol 6 Ch 2 + 5",t:"When the arm triangle fails — the opponent defends by keeping the arm out — the arm often ends up inside the grip. This becomes a Rear Ezekiel (arm inside strangle). The transition from arm triangle failure to Rear Ezekiel is a key failsafe that means a defended arm triangle still threatens submission."},
bdrn_d:{h:"Belly down RNC detail",v:"Vol 6 Ch 6",t:"The strongest finish in the whole system. When the kabob grip and Dagestani handcuff are combined, the opponent's neck and wrist are simultaneously controlled. The belly down position removes their ability to tuck the chin or create space. The handcuff prevents the arm from defending the choke."},
darce_d:{h:"Darce detail — legs first",v:"Vol 6 Ch 7",t:"Standard approach is front headlock first, then leg control. The new approach: legs first, then Darce. This is lower risk because you're never in a compromised position reaching for the arm without leg control. The leg control is already established before the submission attempt begins."},
cowc_d:{h:"Cow catcher detail",v:"Vol 6 Ch 8",t:"Risk management: wrist locks are dangerous because they can cause injury before the opponent can tap. If applied too gently, opponent can resist. So the cow catcher must be applied with full commitment and speed — there's little middle ground. Not recommended for casual training without awareness of this risk."},
kimura2:{h:"Kimura with risk management",v:"Vol 6 Ch 9",t:"Wrist locks involved — same risk management as cow catcher. The kimura from pin positions is powerful but the wrist lock component creates injury risk if not applied correctly (too slow = dangerous, too gentle = resistable). The instructor acknowledges this and treats it as a submission that requires training partner awareness."},
giftwrap:{h:"Gift wrap — position escalation",v:"Vol 6 Ch 10",t:"The argument: the pins are not always the best submission position — they're the best control positions that safely lead to submissions. The gift wrap uses the pin position and submission threat to reach a more dominant position. Opponent is on their shoulder in gift wrap — from here, back exposure and more dominant positions become available."},
halfnels:{h:"Half nelson — belly down and back exposure",v:"Vol 6 Ch 11",t:"The half nelson from the upper body tools section is now used as a submission/position escalation tool. Forces the opponent belly down (face down) and creates back exposure. Combining the half nelson with the leg rides creates a complete trap — they can't stand, can't roll, and their back is exposed."},
final_sub:{h:"Submission or escalation",v:"Vol 6",t:"The system is designed so that each failed submission leads to another. Arm triangle fails → Rear Ezekiel. Belly down RNC is defended → Dagestani handcuff creates a different angle. Gift wrap and half nelson escalate position when direct submissions aren't available. There's always a next step."},
};
function d(id){const x=D[id];if(!x)return;document.getElementById('dp').innerHTML=`<div class="h">${x.h} <span class="v">${x.v}</span></div><div>${x.t}</div>`;}
function sw(v,btn){document.querySelectorAll('.tb button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');['overview','legs','upper','turtle','entries','subs'].forEach(id=>{document.getElementById(id).style.display=id===v?'block':'none';});document.getElementById('dp').innerHTML='<div style="color:var(--color-text-secondary)">Click any node for detail from the transcripts.</div>';}
</script>
