<script>
const D={
start:{h:"Half guard — top position",v:"Vol 1 Intro",t:"Gordon Ryan's starting premise: half guard is one of the most effective ways to pass AND to tire your opponent simultaneously. Unlike other guard passing, you can carry your full body weight. The system covers every defensive configuration the bottom player can use."},
battle:{h:"Win the inside position battle",v:"Vol 1 Ch 6",t:"Everything comes down to inside position. You need to win at both the upper body AND lower body simultaneously. If your partner wins upper body inside position, they'll use it for knee lever escapes and underhook battles. If they win lower body, they'll build to butterfly hooks or sweep setups."},
"2ways":{h:"Two paths to chest-to-chest",v:"Vol 1 Ch 7",t:"Gordon's two master methods: crash the far shoulder (flatten the opponent directly — usually more for passing with a crossface or top head and arm) and hip switching (which gets you to an overback grip or reverse underhook). Both lead to chest-to-chest, just via different upper body positions."},
crash:{h:"Crash the far shoulder",v:"Vol 1 Ch 7",t:"Drive your far shoulder into the opponent's upper body, creating a cranial shift (moving their head to the side). Once you have chest-to-chest contact with a cranial shift, the leg becomes almost impossible to maintain. This is the more direct of the two paths."},
hipswitch:{h:"Hip switch to overback",v:"Vol 1 Ch 7 + Vol 2 Ch 6",t:"Switch your hips past the opponent's top knee shield. The destination is an overback grip — arm over the opponent's back with elbow connected. From here you have the ankle scoop series, backstepping, and flattening methods. A reverse underhook is the alternative when the overback isn't available."},
c2c:{h:"Chest to chest — the goal",v:"Vol 1 Ch 3-4",t:"Once chest-to-chest is achieved with a cranial shift, you're carrying your opponent's body weight. Gordon says this is what makes half guard so exhausting for the bottom player — they're supporting your weight while trying to escape. The cranial shift (pushing their head to one side) prevents the re-guard."},
side:{h:"Side control",v:"Vol 5 Ch 1",t:"The basic pass destination. Dominate the inside hip with your knee on the floor. If your knee can't reach the floor, the pass isn't complete — opponent can recover. Inside hip knee domination is the completion criteria."},
mount:{h:"Mount",v:"Vol 5 Ch 2",t:"Pass 95% to side control, then use two butterfly hooks to step back into mount. Or go directly to high tripod and free the knee over the top. Dominating the outside hip (not inside) when going to mount."},
back:{h:"Back take",v:"Vol 1 Ch 5",t:"Backtracking and leg riding — when you get close to a pass, instead of forcing it, you back up and ride your opponent's leg. This is partly tactical: you set the pace of the match. From leg riding you can enter back takes or reset to passing."},
pass:{h:"Half guard passed",v:"Vol 1 Overview",t:"Gordon states this instructional covers roughly 13 hours of technique — the most comprehensive half guard passing resource he's produced, covering every defensive configuration an expert opponent might use."},
kshield:{h:"Opponent's knee shield",v:"Vol 1-3",t:"The knee shield is the opponent's primary structural defense from bottom half guard. Gordon categorizes them into high knee shield (knee at chest/shoulder level) and low knee shield (knee at hip/stomach level). Each requires slightly different approaches."},
highk:{h:"High knee shield",v:"Vol 1-2",t:"The most common configuration. The opponent's knee is at chest or shoulder level, creating a strong frame. Gordon's methods: stuff the leg past (basic), rise up and through (intermediate), hip switch to overback grip (most reliable). Opponent's upper body frames (none / double post / cross post) determine which method works."},
lowk:{h:"Low knee shield",v:"Vol 3",t:"Lower knee position makes the stuffing method unreliable — the leg can't be driven past as easily. Instead: test the lock first (sprawl and see if legs separate), then use rising methods or hip switch. Upper body posts still determine the specific entry."},
stuff:{h:"Stuffing method",v:"Vol 1 Ch 9-10",t:"Physically drive the opponent's knee to the floor. Works well against no shoulder post — drive the leg down with your hip/knee while establishing upper body inside position. Does NOT work reliably against a double shoulder post or cross shoulder post (opponent's frame prevents it)."},
rise:{h:"Rising method",v:"Vol 1 Ch 11",t:"Quickly pop up through a split squat position and then drop back down into half guard, beating the opponent's leg to inside position. Works against all frame configurations but requires timing. The pop-up bypasses the frame rather than fighting through it."},
hswitch:{h:"Hip switch to overback",v:"Vol 1 Ch 12-13",t:"Switch hips to get past the top knee shield. Best method when opponent has a cross shoulder post — the hip switch creates an angle that makes the cross post less effective. Drive to an overback grip where you control the opponent's back with your elbow."},
testlock:{h:"Test the lock",v:"Vol 3 Ch 2",t:"Against low knee shield, first test how strong the leg lock is. A simple sprawl hip switch will separate legs if the lock is weak — then you can pass immediately. If the lock is strong, proceed to more deliberate passing methods."},
cranial:{h:"Cranial shift",v:"Vol 3 Ch 3",t:"After separating the legs (or anytime chest-to-chest is established), making a cranial shift — moving the opponent's head to the side — is the key. With cranial shift you can pass to either side. Without it, the opponent can re-guard more easily."},
risemeth:{h:"Rising methods — low shield",v:"Vol 3 Ch 6 + 9 + 13",t:"Rising methods are repeated across multiple frames because they're the most versatile — they work against double shoulder posts where stuffing fails, because the rising motion bypasses the frame. Key: pop up fast enough that the cross shoulder post can't follow."},
frames:{h:"Upper body frames",v:"Vol 1-3",t:"Three tiers of opponent defense: no shoulder post (basic, stuff method works), double shoulder post (fight hands to inside), cross shoulder post (most advanced — requires climbing the tree, rising methods, or hip switch combinations). Most skilled opponents use the cross shoulder post."},
nopost:{h:"No shoulder post",v:"Vol 1 Ch 10",t:"Basic configuration. Opponent just wants to escape with the legs. All three methods work — stuff, rise, hip switch. Establish inside hand position and drive to chest-to-chest. Gordon spends less time here because skilled opponents always have upper body frames."},
dpost:{h:"Double shoulder post",v:"Vol 2 Ch 11-14",t:"Opponent places both hands on your upper chest or shoulders. Stuffing method fails because the posts prevent you from getting low enough. Solutions: fight hands to inside position from below (elbow connection), rising methods to bypass the posts, or hip switching to overback where the posts become irrelevant."},
cpost:{h:"Cross shoulder post",v:"Vol 2 Ch 15-17",t:"The correct defense — opponent posts one hand diagonally across your upper body. Gordon says this is what skilled players should be doing. Counter: climbing the tree (posting your hands up their body), rising and hip switch combinations, grip fighting sequences to reach overback."},
oback:{h:"Overback grip",v:"Vol 1 Ch 12-13",t:"Arm over the opponent's back, elbow connected to their far hip. This is Gordon's primary position for flattening opponents out. From here: ankle scoop series (backstep, mount, leg ride), standard flatten and pass, or kimura/guillotine attacks when the bridge happens."},
c2cstart:{h:"Chest to chest — start passing",v:"Vol 4 Ch 12",t:"Now that chest-to-chest is established, Gordon transitions from the knee shield section to the actual passing mechanics. The key insight: passing from half guard is about two simultaneous goals — dominating your partner's inside hip with your knee AND maintaining upper body control."},
handpos:{h:"Hand position hierarchy",v:"Vol 4 Ch 13",t:"Best to worst: top head and arm (control head + one arm), crossface alone, over-unders (symmetric, powerful), body lock. The higher positions restrict movement more completely. Gordon generally starts with crossface and works up to top head and arm or over-unders as the pass develops."},
tripod:{h:"High tripod — the key position",v:"Vol 4 Ch 18",t:"The high tripod is the position between chest-to-chest and completing the pass. One knee is between you and the opponent, propping you up high. From here you free the knee (inside hip domination = pass complete, outside hip = mount). This is the most important tactical position in the system."},
kneefree:{h:"Knee frees to inside hip",v:"Vol 5 Ch 1",t:"Knee hits the inside hip — pass is essentially complete. Move to side control. Dominate that inside position first before worrying about anything else. If the knee comes up but can't reach the floor, the pass is incomplete and opponent can recover."},
bfly:{h:"Butterfly hook in high tripod",v:"Vol 5 Ch 13-16",t:"Most common problem from the high tripod: opponent pommels a butterfly hook in before you free the knee. First test: try hip switch pass (tests if hook is sticky). If sticky, go to pommel battle. Top pommel vs front pommel dilemma — Gordon's answer is to dominate the far hip as the tiebreaker."},
hippost:{h:"Near hip post",v:"Vol 6 Ch 5-6",t:"Opponent posts their near hip to off-balance you as you go to high tripod. Gordon says this is super important and underappreciated. Solution: transfer to a head block position (head crosses to the other side), which eliminates the off-balance problem entirely."},
sc2:{h:"Side control",v:"Vol 5 Ch 1",t:"After freeing the knee to the inside hip — cross-face, far arm trapped, knee driving the hip down. Can pass to side control vs explosive bridges by passing through their bridge rather than against it."},
pommels:{h:"Pommel battle",v:"Vol 5 Ch 16-19",t:"Pommel battle from the high tripod with butterfly hook. Gordon's critical advice: whoever dominates the far hip wins. If both players have butterfly hooks inside, compete for the far hip. The far hip knee wedge or dominating the far hip with a post breaks the tie."},
headblock:{h:"Head block position",v:"Vol 6 Ch 6-8",t:"Head crosses to the other side of the opponent's head, with an underhook. Eliminates the near hip post problem. From head block, convert to over-unders: push your head through from this position and frame on the far side. Wide base of support."},
dunder:{h:"Double unders — best position",v:"Vol 6 Ch 8",t:"Gordon calls double unders the best passing position in half guard. Reason 1: blocks opponent's field of vision. Reason 2: almost no upper body counters available. Reason 3: you can pass symmetrically to either side. Used to be considered risky but Gordon argues it's actually the safest top position."},
mn:{h:"Mount from double unders",v:"Vol 5 Ch 2-3",t:"From double unders, pass 95% to side control then use two butterfly hooks to step back into mount. Or go directly from high tripod — outside hip domination leads to mount entry."},
sn:{h:"Side control from double unders",v:"Vol 5 Ch 1",t:"From double unders, pass in the direction of inside hip domination. Knee hits floor at inside hip — side control achieved."},
atk_start:{h:"Can't pass or want submission",v:"Vol 2 Ch 18-20",t:"The attack options are tactical as much as technical. Sometimes you can't get chest-to-chest yet, sometimes you choose not to. The cross shoulder post creates specific attack opportunities that aren't available from chest-to-chest."},
atk_entry:{h:"Entry opportunities",v:"Vol 2 Ch 18-20",t:"Cross shoulder post / underhook battle creates lanes for: Kimura (when the bridge occurs from hip switch), Darce / inverted kata gatame (off the cross shoulder post), guillotine (when opponent builds up to knees), leg lock entries (threat alone opens passing lanes)."},
kimura:{h:"Kimura from half guard top",v:"Vol 1 Ch 16-17",t:"Comes from the hip switch scenario. When you go to hip switch, opponent bridges to reverse you. Use the bridge: you end up in bottom position, lock the kimura, use it to come back to top. Then pass with the kimura — options include staying with the kimura, transitioning to top head and arm, or punching through to the back."},
darce:{h:"Darce / inverted kata gatame",v:"Vol 2 Ch 19",t:"Gordon calls it 'inverted kata gatame' to be accurate — a darce strangle. Off the cross shoulder post: sit over the opponent's arm while establishing the grip. Then roll through to finish. The darce dilemma: opponent pulls chin away — use this to then transition to guillotine."},
guill:{h:"Guillotine",v:"Vol 1 Ch 18-19 + Vol 2",t:"When opponent bridges during hip switch (like the kimura), or when they build up to their knees to escape. Gordon's key: lean over the far shoulder with the guillotine, not straight back. Chin to chest is the mechanical requirement. Failed guillotine → switch to shoulder crunch (sumi gaeshi)."},
legs:{h:"Leg lock entries",v:"Vol 2 Ch 20",t:"The threat of leg locks — entering the leg entanglement — is often more useful than the leg locks themselves. When opponent has an annoying cross shoulder post and you can't get chest-to-chest or a Kimura/Darce, threatening legs opens passing lanes."},
kimurad:{h:"Kimura detail",v:"Vol 1 Ch 16-17",t:"Bridge counter: hip switch → opponent bridges → end up in bottom position → lock kimura → use kimura to come back on top. Passing with the kimura: multiple options — stay with kimura, go to top head and arm, punch underhook in, or take the back."},
darced:{h:"Darce detail",v:"Vol 2 Ch 19 + Vol 6 Ch 14-15",t:"Crunch the opponent's chin to their chest. If they resist by lifting the chin away — use that opening to transition to guillotine. Darce dilemma: Darce opens guillotine, guillotine opens Darce. The two submissions are connected and threaten simultaneously."},
guilld:{h:"Guillotine detail",v:"Vol 1 Ch 18-19",t:"Failed guillotine → switch to shoulder crunch (this is the Joao Rocha competition moment Ryan references). If the guillotine fails, don't abandon it — use the position to access a shoulder crunch / sumi gaeshi."},
underhookatk:{h:"Opponent gets underhook",v:"Vol 6 Ch 10-22",t:"The most important defensive counter in the whole instructional. When the opponent gets an underhook, they have shoulder-to-armpit connection and head under your chest. They can build to their knees and start wrestling. Gordon's system has multiple layers of counters."},
pommback:{h:"Pommel back to underhook",v:"Vol 6 Ch 12",t:"Use a wizard grip (overhook the opponent's underhooking arm) to prevent them strengthening it. From the wizard, re-establish your own underhook or transition to overback. This is the preferred response when you catch the underhook early."},
overback2:{h:"Sit to overback grip",v:"Vol 6 Ch 13",t:"When opponent gets a good underhook, instead of fighting it directly, lift your elbow and sit over their arm to establish overback. Block their hip with your hand as you do it. From overback, all the standard flattening options apply."},
"3qnelson":{h:"3/4 Nelson",v:"Vol 6 Ch 20",t:"When opponent builds up to their knees with an underhook. Return them to the floor with a 3/4 Nelson — chin-to-chest motion that brings them back down. From there, go directly to Darce strangles. Gordon's preferred response to the build-up."},
def_start:{h:"Dangerous defensive positions",v:"Vol 7-8",t:"The positions that can actually reverse the situation or threaten the top player. Gordon dedicates volumes 7 and 8 to these: scorpion/lockdown (Vol 7), deep half guard (Vol 7), lower leg shift with scoop grip (Vol 6-7), body lock passing (Vol 8 — going offensive with it)."},
scorpion:{h:"Scorpion / lockdown",v:"Vol 7 Ch 1-6",t:"Opponent locks their legs on the outside of yours in an extended position (lockdown). Can extend your leg and compromise your base. Two types: inside scorpion (leg inside) and outside scorpion (easier to deal with — just pull heel to butt). Gordon's primary counter is to pommel the legs and hide the ankle."},
deephalf:{h:"Deep half guard",v:"Vol 7 Ch 7-15",t:"Opponent has gotten underneath you with their head under your hip, usually with a butterfly hook or traditional lock. Goals: pull you overhead (passover), sweep you to the opposite side, or enter leg attacks. Gordon's response: top knee down first, deny ankle exposure, then expose underhook for kimura conversion."},
lowerleg:{h:"Lower leg shift / scoop grip",v:"Vol 6 Ch 23-36",t:"Opponent shifts to control your lower leg with a scoop grip — dangerous because they can roll you or enter deep half. Gordon's system: prevent the scoop (take leg out and away), peel it if they get it, fake backstep to knee slide, force deep half as last resort."},
bodylock:{h:"Body lock passing",v:"Vol 8",t:"Gordon's final system — not really defensive, but offensive using a body lock. Two configurations: under both arms (symmetric, can pass either side, treat like double unders) and arm-in body lock (opponent's arm trapped, asymmetric). Hip control vs cranium control is the core dilemma."},
scorp_c:{h:"Counter scorpion",v:"Vol 7 Ch 2-6",t:"Pommel your legs when chest-to-chest to prevent scorpion from locking. Hide your ankle (shoelaces under your body) so they can't feed a scoop grip. If they get a deep scoop anyway — peel the grip using the hip post and angle. Counter a roll-through by posting the far hip. Counter a passover by stepping over their head."},
deep_c:{h:"Counter deep half",v:"Vol 7 Ch 10-18",t:"Top knee down first — denies ankle exposure. Every time opponent goes to push your knee down, they expose an underhook. Take it and convert to a kimura. The kimura conversion from deep half is Gordon's preferred submission/passing combination from this position."},
lower_c:{h:"Counter lower leg shift",v:"Vol 6 Ch 23-36",t:"Fake a backstep — this either forces a knee slide opportunity (if they open their knees to stop the backstep) or exposes the far hip (if they hold). Prevent scoop by removing the leg early. Peel scoop with hip post and angle creation. Stop rolls by sitting to one hip with knee to far hip."},
body_c:{h:"Body lock pass",v:"Vol 8 Ch 7-13",t:"The hip vs cranium dilemma: sometimes you need cranium control (when opponent's upper body inside position is too strong to get a cranial shift), sometimes hip control (body lock). Body lock under both arms = symmetrical, pass either side. Arm-in lock = pass to near side with near underhook."},
passover:{h:"Counter passover",v:"Vol 7 Ch 6 + 13",t:"Worst position — opponent locks scoop scorpion and passes your leg across their body. Counter: two-on-one on the leg immediately, hip post, step over the head. Gordon covers this in detail because it's the most dangerous scorpion sequence."},
kimconv:{h:"Kimura conversion",v:"Vol 7 Ch 16-18",t:"The primary weapon from deep half counter. Deny ankle exposure → opponent exposes underhook → lock kimura over their arm → convert to submission, back take, or use kimura handle to return to passing position. Gordon's favorite sequence from this position."},
rollstop:{h:"Stop the roll",v:"Vol 6 Ch 32",t:"Opponent has the scoop grip and tries to roll you over. Sit to one hip reactively, take your knee to the far hip. This stops the roll. Then peel the scoop grip from the hip post position."},
standing:{h:"Standing passing option",v:"Vol 7 Ch 12",t:"When the ground game gets too complicated — opponent has too many leg entrances or is using deep half effectively — just stand up and pass from the feet. Gordon explicitly recommends this as a reset option, not a failure."},
regain:{h:"Regain passing position",v:"Vol 7-8",t:"The meta-lesson of the defensive volumes: there is always a counter, always a next step. Gordon's system is designed so that even the opponent's best defensive positions lead back into his passing structure or into submission opportunities."},
};
function d(id){const x=D[id];if(!x)return;document.getElementById('dp').innerHTML=`<div class="h">${x.h} <span class="v">${x.v}</span></div><div>${x.t}</div>`;}
function sw(v,btn){document.querySelectorAll('.tb button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');['overview','knee','chest','attacks','defensive'].forEach(id=>{document.getElementById(id).style.display=id===v?'block':'none';});document.getElementById('dp').innerHTML='<div style="color:var(--color-text-secondary)">Click any node for detail from the transcripts.</div>';}
</script>
