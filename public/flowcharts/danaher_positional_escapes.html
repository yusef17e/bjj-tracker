<script>
const D={
p1:{h:"The traditional binary approach fails",v:"Vol 1 Ch 3",t:"Traditional jiu-jitsu teaches escapes as binary: either you get out completely or you survive. Most curriculum start with defensive skills because students inevitably end up on the bottom of mount or side control. The problem is the approach: survive OR escape. This leads to timid, passive grappling that never transitions to attack."},
p2:{h:"Satisficing vs maximizing",v:"Vol 1 Ch 6",t:"Satisficing (a portmanteau of satisfy + suffice): choosing an outcome that is good enough rather than holding out for the perfect outcome. Applied to escapes: don't wait for the perfect moment to attempt a full escape — take a satisficing outcome (better position, inside control, partial escape) and build from there. Maximizers wait forever and accomplish nothing."},
p3:{h:"The sunk cost principle",v:"Vol 1 Ch 7",t:"A well-studied psychological principle: humans irrationally persist with failed investments because of what has already been spent. Applied to escapes: if an escape attempt has failed, the effort already spent is irrelevant to future decisions. Abandon the failed attempt immediately and regroup. Most athletes cling to failed escapes far too long."},
p4:{h:"Escape skills = confidence foundation",v:"Vol 1 Ch 2",t:"The counterintuitive starting point of the New Wave series: to develop a bold attacking game, you must first develop reliable escapes. Knowing you can get out of bad positions makes you willing to take risks. Without escape confidence, every offensive attempt is constrained by fear of ending up on the bottom."},
p5:{h:"Game plan: inside position first",v:"Vol 1 Ch 8",t:"The game plan when pinned: first priority is inside position — getting your frames between you and the opponent's wedges. Inside position blocks the transition from pin to submission. Until you own inside position, you are vulnerable to both the pin and submissions simultaneously. Win inside first, then work the escape."},
p6:{h:"The 5 pins of jiu-jitsu",v:"Vol 1 Ch 9",t:"The five pins: side pins (including crossface and reverse crossface variations), mounted position, rear mount/back control, knee on belly, and turtle position. Each requires a different escape approach because each presents a different positional problem. There is no universal escape — you must diagnose which pin and which grip before selecting the escape."},
p7:{h:"Problem solving under stress",v:"Vol 4 Ch 8",t:"Getting out of pins is problem solving under stress. The key: how your opponent is holding you determines what problem you need to solve. A crossface side pin and a reverse crossface side pin require completely different solutions. You cannot use one-size-fits-all — diagnose the grip, identify the specific problem, customize the solution."},
m0:{h:"Mounted position",v:"Vol 2",t:"The mounted position is one of the most dangerous pins. Danaher emphasizes that the goal from bottom mount is not merely to escape — it is to escape into a position where you have the advantage. The maximizing philosophy applies: escape + counter simultaneously whenever possible."},
m1:{h:"Maximizing escape philosophy",v:"Vol 2 Ch 1",t:"From mount, the goal is to escape AND to put yourself in a better position than before the pin started. If you simply escape to guard, you've achieved survival. If you escape into a leg lock entry or a sweep, you've achieved something better. This is the maximizing philosophy applied to mount escapes."},
m2:{h:"Lateral kipping escape",v:"Vol 2 Ch 1",t:"The best starting point for mount escapes — most students find it most accessible. The lateral kip uses explosive leg movement to bridge and roll. Danaher's key insight: most people do the lateral kip wrong because they go straight sideways. The kip must go diagonally — forward and to the side — to actually displace the mounted opponent."},
m3:{h:"Misdirectional kipping escape",v:"Vol 2 Ch 2",t:"After years of teaching, Danaher concluded that the lateral escape is best first because students can do it. The misdirectional kip adds deception: fake movement in one direction to draw the opponent's weight, then kip the other direction. The misdirection creates a brief window where the opponent's base is compromised."},
m4:{h:"Overhead kipping escape",v:"Vol 2 Ch 3",t:"When the lateral kip is defended — opponent widens base to the sides — the overhead kip exploits the fact that wide base is not stable against vertical movement. The overhead kip goes upward rather than sideways. This creates a very different angle of attack that catches opponents who have adjusted to the lateral."},
m5:{h:"Elbow escape family",v:"Vol 2 Ch 4-5",t:"The elbow escape is the most commonly taught mount escape. Danaher's key insight: there are inside and outside variations, and they work at very different contexts. Outside elbow escape is taught to beginners but its real value at high levels is while being mounted (during the transition), not after the mount is established."},
m6:{h:"Outside elbow escape",v:"Vol 2 Ch 5",t:"At high level competition, the outside elbow escape's real value is during the mounting process — as the opponent is getting mounted on you. Once fully mounted by an expert, outside elbow escape becomes much harder. Use it reactively as the mount is being established rather than as a remedy after."},
m7:{h:"Inside elbow escape",v:"Vol 2 Ch 4",t:"The inside elbow escape is the expert variation — harder to perform but opens directly into leg lock counter-attacks. Instead of escaping outward (away from opponent), the inside variation creates a path directly into the opponent's legs. This makes it a dual-purpose move: escape from mount AND entry into leg entanglement."},
m8:{h:"Counter-attack with leg locks",v:"Vol 2 Ch 4",t:"The inside elbow escape's unique value: it positions you directly into your opponent's legs as you escape. This creates an immediate counter-attack opportunity. Rather than simply recovering guard, you convert the escape directly into an offensive leg lock entry. The mounted position becomes a transition point rather than a crisis."},
b0:{h:"Rear mount / back control",v:"Vol 3",t:"Rear mount is described as the most dangerous pin in jiu-jitsu — the opponent has immediate access to strangulation and the back-taken player has no direct offense. Danaher covers this in depth across multiple chapters because it requires the most systematic approach of all the pins."},
b1:{h:"Two battles simultaneously",v:"Vol 3 Ch 1-2",t:"Getting out of rear mount requires winning two separate battles at the same time: the hand fight (preventing the choking arm from locking in) and the head fight (preventing the head from being pinned which would block the turn). Both battles must be engaged simultaneously — winning one while losing the other still results in the strangle."},
b2:{h:"Battle 1: The hand fight",v:"Vol 3 Ch 1",t:"The hand fight is the priority: strip the choking arm before it locks in. Danaher's method: two-on-one the choking arm, peel it off, drive your elbow to the mat on the same side. This creates the turning angle. The hand fight must be won first — without it, any turn attempt exposes you to the strangle."},
b3:{h:"Battle 2: The head fight",v:"Vol 3 Ch 2",t:"If the opponent pins your head, you cannot turn to escape. The head fight: prevent head from being pinned by keeping it connected to your shoulder. If the head is already pinned, you must free it first using specific movements before the turn becomes possible. The spinning escape (Vol 3 Ch 7) addresses situations where the upper body connection is used to pin."},
b4:{h:"Body triangle — the special problem",v:"Vol 3 Ch 4-6",t:"The body triangle is a uniquely difficult leg configuration from back control — Danaher calls it a major source of vexation and frustration. The body triangle prevents the usual escape methods because the legs create a rigid figure-4 around the torso. Requires its own specific theory and methods."},
b5:{h:"The 4 triangles theory",v:"Vol 3 Ch 5",t:"Danaher's theory: body triangles go from strongest to weakest in a spectrum of 4 configurations. The key insight: rather than attacking the triangle directly (which is very hard), systematically convert the stronger configuration to a slightly weaker one, then weaker still, until you reach an escapable version. Progressive weakening beats direct resistance."},
b6:{h:"Spinning escape",v:"Vol 3 Ch 7",t:"When the opponent uses an upper body connection to restrict movement during back escapes, the spinning escape converts the upper body connection against them. By spinning in a specific direction while maintaining the upper body connection, you create a moment where the back is given up but you arrive in a dominant position — often directly into guard or sweeping."},
b7:{h:"Headlock escape",v:"Vol 3 Ch 8",t:"When the opponent applies a headlock variation from back control (neck pressure, head and arm style), this creates a unique puzzle. Standard back escape methods fail because the head is being used as a lever. Specific counter to headlock grip that uses the opponent's head control against them to create an escape angle."},
b8:{h:"Guard or leg lock counter",v:"Vol 3 Ch 3",t:"The maximizing philosophy applied to back escapes: don't just recover guard — enter the opponent's legs. When you throw your legs in as you escape, instead of putting them back into guard position, put them into ashi garami (leg entanglement) and finish with a leg lock. The escape becomes the attack."},
s0:{h:"Side and north-south pins",v:"Vol 4-6",t:"Side pins are the most commonly occurring pins in jiu-jitsu and come in more variations than any other pin type. Danaher covers crossface, reverse crossface, sit-out variations, and north-south as separate problems with different solutions. The key: identify exactly which side pin configuration you are in before choosing your escape."},
s1:{h:"Identify pin type and grip",v:"Vol 4 Ch 8-10",t:"The central problem of crossface side pins: near hip vs far hip connection. The central problem of reverse crossface: near shoulder vs far shoulder. Each combination creates a different escape problem. You cannot just 'escape side control' — you must identify the specific configuration and customize. This is problem solving under stress."},
s2:{h:"Wedges vs frames",v:"Vol 8 Ch 5",t:"The universal framework: a pin is a set of wedges placed around your hips, head, and shoulders. Your goal is to form frames inside his wedges. If you can get your frames inside his wedges, you can move underneath the pin and escape. If his wedges are outside your frames, he controls you completely. Inside position wins."},
s3:{h:"Side elbow escape",v:"Vol 4-5",t:"The primary escape from side pins. Uses kipping (explosive leg movement) combined with reverse shrimping. The combination creates space and turns you toward the opponent. Requires: kip to create space, reverse shrimp to position elbow, elbow drives to inside, turn to guard. Danaher spends multiple volumes on the details because it's the most important escape from side control."},
s4:{h:"High leg escape",v:"Vol 5-6",t:"The auxiliary escape to the side elbow — when the elbow escape isn't working, switch to high leg. The high leg escape uses the far leg over the opponent's body to create a sweep or direct escape. They work as a pair: the side elbow escape and high leg escape create a two-threat system that makes it harder for the opponent to defend both simultaneously."},
s5:{h:"Knee escape",v:"Vol 5 Ch 8-10",t:"The knee escape is covered in 3 parts: basic knee escape, ankle trap combination (when you can feel the underhook but can't get all the way up), and beating the crossface (when the crossface blocks the standard knee escape). Danaher says knee escapes work extremely well against people who switch to reverse crossface — so it's an important specialty."},
s6:{h:"Tricep post / back door escape",v:"Vol 6 Ch 2-3",t:"Turning away from the opponent — the opposite direction from the side elbow escape. Used only when turning in is impossible. Tricep post escape creates a frame with the tricep to allow turning away. Back door escape uses the same idea — when you turn away the primary concern is back exposure, and the back door escape addresses this by threading the body through a specific path that prevents back exposure."},
s7:{h:"Side elbow escape into leg locks",v:"Vol 5 Ch 5",t:"From arm-dominant pins like side control and north-south, Danaher generally favors going to upper body attacks first, then leg entries. The side elbow escape can be converted directly into leg lock entries — instead of completing the escape to guard, the movement of the escape positions you into ashi garami for a leg lock counter-attack."},
s8:{h:"North-south: unique elements",v:"Vol 6 Ch 5-8",t:"North-south presents unique elements not found in regular side pins: the opponent faces away from your head, changing all the leverage relationships. The high leg escape works differently here. Variations of north-south (standard, reverse, with underhook, with arm trap) each require variations in the escape approach."},
s9:{h:"The clamp — special study",v:"Vol 5 Ch 4",t:"The clamp is connected to ashi garami (leg entanglement). It controls the distance of your opponent's hips from your hips. Ashi garami works by putting a knee in front and behind — creating a shield and a stop. The clamp is a special study that bridges the escape world and the leg lock world, showing how pin escapes naturally transition into leg lock attacks."},
t0:{h:"Turtle position",v:"Vol 7",t:"Turtle is described as a position that should be treated almost like a pin — even though technically neutral, the opponent is close to taking the back. Danaher identifies turtle as one of the 5 pins because the threat level is similar: just a few movements and hooks are in. The escape approach is unique because the opponent can connect in many different ways."},
t1:{h:"Identify opponent's connection",v:"Vol 7 Ch 1",t:"From turtle, the opponent can connect with: tight waist (elbow controls hip), body lock (both arms — controlling, but less submission danger), seatbelt (immediate strangle danger), one-on-one (hand control like a tight waist), covering hips (leg over with horse position). Each requires a different escape."},
t2:{h:"Tight waist: Makikomi",v:"Vol 7 Ch 2",t:"The Makikomi is a particularly effective counter to the tight waist from turtle. The opponent's arm around the waist becomes a handle — you use it to roll them over your body in a barrel roll motion. The makikomi uses the opponent's own tight waist grip against them, turning their control point into the lever for your escape."},
t3:{h:"Shoulder roll",v:"Vol 7 Ch 3",t:"When the opponent has a deep tight waist and wises up to the makikomi — they put their head low to prevent the barrel roll. The shoulder roll is the answer: rather than rolling over them, you roll under them, using the shoulder as the pivot point. Works from a similar setup to the makikomi but exploits different body mechanics."},
t4:{h:"Body lock escape",v:"Vol 7 Ch 4",t:"When the opponent transitions from tight waist to body lock (locking both hands), the options change. Body lock is more controlling but less immediately dangerous for submissions. The body lock escape addresses the complications that arise when the opponent commits both arms and creates a more rigid control."},
t5:{h:"Seatbelt: reach-back sumi gaeshi",v:"Vol 7 Ch 5",t:"The seatbelt is the most dangerous turtle control — immediate strangle threat. The reach-back sumi gaeshi is one of the most effective counters: you reach back and grab the opponent, then use a sumi gaeshi (stomach throw) motion to bring them over. The seatbelt grip actually assists the throw because it keeps the connection."},
t6:{h:"Seatbelt: peek-out escape",v:"Vol 7 Ch 7",t:"A second option against the seatbelt. The peek-out: put your head down to the mat, take the inside knee to outside knee position, swisher step (a cross-step movement that is a major theme of turtle escapes). The peek-out creates an angle where you can turn into the opponent without giving up your back."},
t7:{h:"General hand fighting from turtle",v:"Vol 7 Ch 8",t:"All turtle escapes rely on the hand fight. The opponent's connection is always through his hands — tight waist, body lock, seatbelt, one-on-one. The swisher step is a major movement tool. Inside control from turtle is the key to all escapes — get a hand connection to inside before attempting any specific escape technique."},
t8:{h:"Guard recovery",v:"Vol 7",t:"The conservative outcome from turtle: turn away from the opponent (opposite direction to where they're attacking) and recover guard. This is satisficing — not maximizing, but a good enough outcome. Prevents back take, recovers neutral position, sets up your own offense."},
t9:{h:"Counter-attack from turtle",v:"Vol 7 Ch 5",t:"The maximizing outcome from turtle: the reach-back sumi gaeshi and leg entries. When the opponent is controlling from turtle, their legs are in a compromised position. The sumi gaeshi sweep takes them directly to their back. Leg entries create ashi garami counter-attacks. The maximizing philosophy applied to turtle: don't just escape — reverse."},
f0:{h:"Under a pin — recall the 5-step method",v:"Vol 8",t:"Danaher's summary of positional escape — a framework for recalling information under stress. The 5-step method applies universally to all pins. When you're in a bad position and panicking, the 5 steps give you a systematic sequence to follow rather than reacting randomly."},
f1:{h:"Step 1: Defensive responsibility",v:"Vol 8 Ch 1",t:"The foundation: chin down (protect against strangles), elbows in (protect against arm attacks), knees in (protect against leg attacks), play defensively. Before you can escape, you must stop the situation from getting worse. Defensive responsibility is about removing the immediate threat so you can think clearly and act systematically."},
f2:{h:"Step 2: Kuzushi",v:"Vol 8 Ch 2",t:"Kuzushi means off-balancing. Danaher calls it 'the joker' — it can occur at any point in the sequence, not just as step 2. If you can off-balance your opponent at any moment, seize the opportunity immediately. Kuzushi creates a window that makes all subsequent steps easier. Always be looking for kuzushi moments throughout the entire sequence."},
f3:{h:"Step 3: The first frame",v:"Vol 8 Ch 3",t:"Create a frame inside the opponent's wedges. The frame is a structure — typically using your arms or legs — that creates space between you and the opponent. The first frame doesn't need to complete the escape. It just needs to buy enough space to execute the primary entry point. Think of it as prying open a door."},
f4:{h:"Step 4: Primary entry point",v:"Vol 8 Ch 4",t:"Every major escape in jiu-jitsu has one essential movement that makes everything else possible. This is the primary entry point. For the side elbow escape it's the elbow driving inside. For the mount kip it's the bridge at the right angle. For the back escape it's winning the hand fight. Identify this movement for each escape and practice it in isolation until it's automatic."},
f5:{h:"Step 5: Majority inside control",v:"Vol 8 Ch 5",t:"Win the inside position battle. The battle of wedges vs frames: if you own the inside, you can move underneath the pin. If he owns the inside, he can maintain the pin and transition to submissions. This is the decisive step — achieving majority inside control is effectively the escape. Everything after flows naturally."},
f6:{h:"Step 6 (bonus): Your choice",v:"Vol 8 Ch 6",t:"The bonus step: once you have inside control and the escape is nearly complete, you have a choice. Escape to guard (satisficing — safe). Counter-attack with a submission (maximizing — ambitious). Sweep into top position (maximizing). Enter the legs (maximizing). The choice depends on what the opponent has given you and your comfort level in each area."},
};
