
<style>
* { box-sizing: border-box; }
body { margin: 0; }
.node-box {
  cursor: pointer;
  transition: opacity 0.15s;
}
.node-box:hover { opacity: 0.82; }
.legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.vol-btn {
  padding: 4px 12px;
  border-radius: 6px;
  border: 0.5px solid var(--color-border-secondary);
  background: var(--color-background-secondary);
  color: var(--color-text-secondary);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.vol-btn.active {
  background: var(--color-background-tertiary);
  color: var(--color-text-primary);
  border-color: var(--color-border-primary);
  font-weight: 500;
}
#detail-panel {
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: 10px;
  padding: 12px 16px;
  margin-top: 12px;
  background: var(--color-background-secondary);
  font-size: 13px;
  color: var(--color-text-secondary);
  line-height: 1.6;
  min-height: 56px;
}
#detail-panel .dtitle {
  font-size: 14px;
  font-weight: 500;
  color: var(--color-text-primary);
  margin-bottom: 4px;
}
</style>

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="vol-btn active" onclick="filterVol('all',this)">All volumes</button>
    <button class="vol-btn" onclick="filterVol('1',this)">Vol 1</button>
    <button class="vol-btn" onclick="filterVol('2',this)">Vol 2</button>
    <button class="vol-btn" onclick="filterVol('3',this)">Vol 3</button>
  </div>
  <div style="display:flex;gap:12px;font-size:12px;color:var(--color-text-secondary);flex-wrap:wrap">
    <span><span class="legend-dot" style="background:#534AB7"></span>Position</span>
    <span><span class="legend-dot" style="background:#0F6E56"></span>Submission</span>
    <span><span class="legend-dot" style="background:#993C1D"></span>Sweep outcome</span>
    <span><span class="legend-dot" style="background:#185FA5"></span>Counter</span>
  </div>
</div>

<svg id="main-svg" width="100%" viewBox="0 0 680 680" role="img">
  <title>The Forgotten Sweep — BJJ Technique Flowchart</title>
  <desc>Interactive flowchart of Jeff Curran's scissor sweep system across 3 volumes</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ROW 0: Start -->
  <g class="node-box" data-vol="1" data-id="start" onclick="showDetail('start')">
    <rect x="250" y="14" width="180" height="44" rx="8" fill="#B4B2A9" stroke="#888780" stroke-width="0.5"/>
    <text x="340" y="36" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#2C2C2A">Closed guard</text>
  </g>

  <!-- Arrow down to grips -->
  <line x1="340" y1="58" x2="340" y2="82" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ROW 1: Proper grips + loading -->
  <g class="node-box" data-vol="1" data-id="grips" onclick="showDetail('grips')">
    <rect x="190" y="82" width="150" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="265" y="101" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#3C3489">Establish grips</text>
    <text x="265" y="120" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#534AB7">Collar + sleeve</text>
  </g>
  <g class="node-box" data-vol="1" data-id="load" onclick="showDetail('load')">
    <rect x="360" y="82" width="150" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="435" y="101" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#3C3489">Load position</text>
    <text x="435" y="120" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#534AB7">Knee across, elbow down</text>
  </g>

  <!-- Arrows -->
  <path d="M340 58 L265 82" fill="none" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M340 58 L435 82" fill="none" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="82" x2="340" y2="134" stroke="none"/>
  <!-- Connect grips to load -->
  <line x1="340" y1="134" x2="340" y2="158" stroke="none"/>

  <!-- Converge grips + load -> scissor sweep -->
  <path d="M265 134 L265 150 L340 150" fill="none" stroke="var(--color-border-secondary)" stroke-width="1"/>
  <path d="M435 134 L435 150 L340 150" fill="none" stroke="var(--color-border-secondary)" stroke-width="1"/>
  <line x1="340" y1="150" x2="340" y2="170" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ROW 2: Scissor sweep attempt -->
  <g class="node-box" data-vol="1" data-id="scissor" onclick="showDetail('scissor')">
    <rect x="220" y="170" width="240" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="340" y="189" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#3C3489">Scissor sweep attempt</text>
    <text x="340" y="208" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#534AB7">Drop, chop, hook climb</text>
  </g>

  <!-- ROW 3: Two branches - sweep lands or opponent reacts -->
  <path d="M280 222 L180 258" fill="none" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M400 222 L500 258" fill="none" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Branch A: Sweep lands -> Mount -->
  <g class="node-box" data-vol="1" data-id="mount" onclick="showDetail('mount')">
    <rect x="80" y="258" width="200" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="180" y="277" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#085041">Mount</text>
    <text x="180" y="296" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#0F6E56">Collar + sleeve retained</text>
  </g>

  <!-- Branch B: Opponent posts hand / resists -->
  <g class="node-box" data-vol="1,2,3" data-id="resist" onclick="showDetail('resist')">
    <rect x="380" y="258" width="220" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="490" y="277" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#0C447C">Opponent reacts</text>
    <text x="490" y="296" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#185FA5">Posts hand / drives / spears</text>
  </g>

  <!-- From Mount -> Loop choke or collar choke -->
  <line x1="180" y1="310" x2="180" y2="338" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)"/>

  <g class="node-box" data-vol="1" data-id="loop" onclick="showDetail('loop')">
    <rect x="80" y="338" width="200" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="180" y="357" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#085041">Loop choke</text>
    <text x="180" y="376" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#0F6E56">Dress head, drop elbow</text>
  </g>

  <!-- From opponent reacts: 3 counters -->
  <path d="M415 310 L200 418" fill="none" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M490 310 L490 418" fill="none" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M560 310 L580 418" fill="none" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ROW 4: Counter options -->
  <!-- Triangle -->
  <g class="node-box" data-vol="2" data-id="triangle" onclick="showDetail('triangle')">
    <rect x="100" y="418" width="180" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="190" y="437" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#085041">Triangle</text>
    <text x="190" y="456" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#0F6E56">→ Arm trap + loop choke</text>
  </g>

  <!-- Leg weave / back -->
  <g class="node-box" data-vol="2" data-id="legweave" onclick="showDetail('legweave')">
    <rect x="380" y="418" width="220" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="490" y="437" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#0C447C">Leg weave</text>
    <text x="490" y="456" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#185FA5">Counter backstep</text>
  </g>

  <!-- Sit over sweep -->
  <g class="node-box" data-vol="2" data-id="sitoversweep" onclick="showDetail('sitoversweep')">
    <rect x="490" y="550" width="180" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="580" y="569" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#712B13">Sit-over sweep</text>
    <text x="580" y="588" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#993C1D">Elbow post → top position</text>
  </g>

  <!-- From leg weave -->
  <path d="M490 470 L490 510 L360 510 L360 550" fill="none" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M490 470 L580 550" fill="none" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Take the back -->
  <g class="node-box" data-vol="2" data-id="back" onclick="showDetail('back')">
    <rect x="260" y="550" width="200" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="360" y="569" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#712B13">Take the back</text>
    <text x="360" y="588" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#993C1D">Collar choke option</text>
  </g>

  <!-- Kimura -->
  <g class="node-box" data-vol="3" data-id="kimura" onclick="showDetail('kimura')">
    <rect x="30" y="550" width="200" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="130" y="569" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#085041">Kimura</text>
    <text x="130" y="588" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#0F6E56">When opponent hand-posts</text>
  </g>

  <!-- From triangle to kimura -->
  <path d="M130 470 L130 550" fill="none" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- from triangle to back -->
  <path d="M240 470 L340 550" fill="none" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Vol labels -->
  <text x="12" y="108" style="font-size:11px;fill:var(--color-text-secondary);font-weight:500">Vol 1</text>
  <text x="12" y="290" style="font-size:11px;fill:var(--color-text-secondary);font-weight:500">Vol 1</text>
  <text x="12" y="450" style="font-size:11px;fill:var(--color-text-secondary);font-weight:500">Vol 2</text>
  <text x="12" y="582" style="font-size:11px;fill:var(--color-text-secondary);font-weight:500">Vol 3</text>

  <!-- Taking out the trash label on vol3 row -->
  <g class="node-box" data-vol="3" data-id="trash" onclick="showDetail('trash')">
    <rect x="30" y="628" width="200" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="130" y="650" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#712B13">Taking out the trash</text>
  </g>
  <line x1="130" y1="602" x2="130" y2="628" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Head spear counter -->
  <g class="node-box" data-vol="3" data-id="headspear" onclick="showDetail('headspear')">
    <rect x="260" y="628" width="200" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="360" y="650" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:500;fill:#0C447C">Counter head spear</text>
  </g>
  <line x1="360" y1="602" x2="360" y2="628" stroke="var(--color-border-secondary)" stroke-width="1" marker-end="url(#arrow)"/>
</svg>

<div id="detail-panel">
  <div style="color:var(--color-text-secondary)">Click any node to see technique details from the transcripts.</div>
</div>

<script>
const details = {
  start: { title: "Closed guard", vol: "Vol 1 — Foundation", desc: "Starting position. The entire scissor sweep system begins here. Curran emphasizes that even the threat of the sweep creates openings." },
  grips: { title: "Establish grips", vol: "Vol 1 — Proper Grips", desc: "Collar grip between the shoulders (not too deep, not too low). Sleeve grip using four fingers over the top — no thumb under, illegal in tournaments and dangerous. Keep elbow snug to prevent stripping." },
  load: { title: "Load the position", vol: "Vol 1 — Position Entry/Loading", desc: "Open guard, shrimp out, slide knee across at 45°. Knee to chest/shoulder line. Outside leg heavy on opponent's hips. Pull up to elbow. Create uncomfortable push-pull tension." },
  scissor: { title: "Scissor sweep attempt", vol: "Vol 1 — Drop and Chop to Mount", desc: "Drop lower body, let opponent's weight come on top of you. Bottom hook heel stays UP — catches behind the knee and prevents posting. Top leg chops across. Pull yourself up to mount. Don't sweep across the floor — keep hips connected." },
  mount: { title: "Mount", vol: "Vol 1 — Drop and Chop / Loop Choke", desc: "Sweep lands — maintain collar and sleeve grip. Isolate immediately. Don't celebrate — opponent will fight hardest to escape right now. Transition directly to loop choke or collar choke." },
  loop: { title: "Loop choke", vol: "Vol 1 — Loop Choke Mechanics", desc: "Collar grip with top finger at collarbone level, some slack required. Dress the head (club forearm inward + lift elbow simultaneously). Left foot hugs opponent's hip. Right heel tight. Lift and twist to finish. If opponent rolls, follow to top — worst case you get mount." },
  resist: { title: "Opponent reacts", vol: "Vol 1–3 — Counters", desc: "When the sweep is threatened, opponents post a hand, drive forward, weave legs, or spear with the head. Each reaction opens a specific counter in Curran's system." },
  triangle: { title: "Triangle setup", vol: "Vol 2 — Triangle Set Up", desc: "Off the scissor sweep load. When opponent's arm is exposed, lock the triangle. From triangle: arm trap + loop choke combo. Sweep, submission, or both." },
  legweave: { title: "Leg weave (counter backstep)", vol: "Vol 2 — Countering the Backstep", desc: "When opponent tries to backstep to pass, weave legs to regain control. Sets up back take, sit-over sweep, or head spear choke." },
  back: { title: "Take the back", vol: "Vol 2 — Take the Back", desc: "From leg weave or sweep follow-up. Collar choke option immediately available. Curran references his Back Control series for finishing from here." },
  sitoversweep: { title: "Sit-over sweep", vol: "Vol 2 — Sit Over Sweep Mechanics", desc: "Opponent posts elbow to avoid being swept. Use elbow posting against them — sit over for the sweep, ending in top/cross body position." },
  kimura: { title: "Kimura when opponent hand-posts", vol: "Vol 3 — Kimura", desc: "Off leg weave when opponent posts hand to avoid sweep. Lock Kimura over the top. Two reactions: opponent tries to climb up (go with them to mount, power kimura from cross body) or they accept sweep (traditional finish). Worst case: pull yourself to mount using Kimura as handle." },
  headspear: { title: "Counter the head spear", vol: "Vol 3 — Countering the Head Spear", desc: "Opponent spears head in deep from leg weave to flatten you. Keep slack in grip. Direct their head under your arm. One-handed collar choke / guillotine from guard. If they roll: follow to top, arm weave, finish choke from side. Worst case: side control." },
  trash: { title: "Taking out the trash", vol: "Vol 3 — Taking out the Trash", desc: "Opponent pushes knee down and condenses. Post foot wide, pull and spin — dump them sideways to cross body. Variations: pull sleeve across for same outcome, or transition to paper cutter choke. If all fails: shoot for shoulder lock on the posting arm." },
};

function showDetail(id) {
  const d = details[id];
  if (!d) return;
  const panel = document.getElementById('detail-panel');
  panel.innerHTML = `<div class="dtitle">${d.title} <span style="font-size:12px;font-weight:400;color:var(--color-text-secondary)">${d.vol}</span></div><div>${d.desc}</div>`;
}

function filterVol(vol, btn) {
  document.querySelectorAll('.vol-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.node-box').forEach(n => {
    const v = n.getAttribute('data-vol') || '';
    if (vol === 'all' || v.includes(vol)) {
      n.style.opacity = '1';
    } else {
      n.style.opacity = '0.2';
    }
  });
}
</script>
