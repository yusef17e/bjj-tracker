<script>
const D = {
  c_why:{t:"Why grip fighting matters",v:"Vol 1",d:"Most BJJ practitioners never develop this skill because most gyms teach techniques in isolation without the engagement phase. Elite grapplers in judo and wrestling are universally good at this because competition forces it. In BJJ many people train casually against others who also never learned it — so the gap is never exposed until you spar someone elite."},
  c_engage:{t:"The engagement phase",v:"Vol 4",d:"The moment from no grips until grips are established and a guard position is set. The winner of the engagement phase dictates what happens next. If they win — they're playing their passing game. If you win — you're playing your guard offensively. Losing the hand fight means you immediately enter guard RETENTION, not guard playing."},
  c_align:{t:"Alignment theory",v:"Vol 1",d:"A person in good alignment has their weight distributed and can resist attacks. Kuzushi is the art of breaking alignment — moving their center of gravity outside their base so they become vulnerable. You must understand alignment to know WHEN someone is vulnerable (or when you've made a mistake) so you can exploit the moment."},
  c_pillars:{t:"Three core principles",v:"Vol 1-2",d:"Everything in the system flows from three ideas: range battles (you have a preferred range, they have one — winner advances, loser retreats and re-engages), lever access (collar → spine, wrist → elbow, ankle → knee — longer lever = more force), center of gravity (push their CoG outside their base and they fall)."},
  c_range:{t:"Range battles",v:"Vol 2",d:"Every exchange has a range preference. If they win the range battle — retreat, don't keep engaging from a losing position. The loser stops going forward, addresses the problem, then re-engages on their own terms. In the gi especially: neutral collar-for-collar is fine. Losing a range battle is not a crisis — it's a signal to reset."},
  c_lever:{t:"Lever access",v:"Vol 1-2",d:"The collar connects to the spine (long lever — small input, big movement). The wrist connects to the elbow. The ankle connects to the knee. Using longer levers requires less strength. This is why a collar drag on someone who ignores it works regardless of size: you're accessing their spine, not fighting their arms."},
  c_cog:{t:"Centre of gravity",v:"Vol 1",d:"The fundamental mechanical goal of all kuzushi. Every sweep and off-balance is about moving opponent's center of gravity outside their base of support. Once it's outside, they must step or put a hand down to recover — and that reaction is your attack window."},
  c_kuz:{t:"Kuzushi — two functions",v:"Vol 3",d:"Like a jab from a world-class boxer — it can knock out a beginner by itself, but against a skilled opponent it draws a reaction that sets up the real attack. You need to understand which function you're using. Against someone with good posture: kuzushi is probing to find their response pattern. Against someone weak: just knock them over."},
  c_sweep:{t:"Direct sweep / score",v:"Vol 3",d:"Against opponents unfamiliar with the kuzushi material or with poor base, the kuzushi IS the sweep — no follow-up needed. Rob describes working de la Riva kuzushi against untrained partners: 'It took quite a while for me to catch up and go oh no no you're not catching me with this stupid off-balancing thing.' Until then it was scoring directly."},
  c_react:{t:"Reaction → follow-up",v:"Vol 3",d:"Against skilled opponents, the kuzushi creates a predictable defensive reaction. Your job is to read that reaction and plug in the appropriate follow-up attack. You alternate directions — pull forward / push sideways / pull back — and chain whatever the reaction gives you. The system makes your guard unpredictable."},
  c_pull:{t:"Pull forward + push/side — alternate",v:"Vol 3",d:"The organizing principle of all kuzushi sequences. You always alternate directions. Pull forward (collar drag) → they brace backward → sweep backward. Push sideways → they step out → go for the opposite angle. Staying one-directional is predictable and easy to defend. Alternating keeps them guessing and creates the openings."},
  g_start:{t:"Initial contact — no grips",v:"Vol 1",d:"The moment you and your training partner/opponent come within range. This is the engagement phase starting point. Most people skip straight to 'I'll grab the sleeve' without understanding that the grip fight begins before any fabric is touched — it starts with your body positioning and initial reach."},
  g_optimal:{t:"Optimal grip hierarchy",v:"Vol 1",d:"Two-on-one is the best grip in the system — one hand on wrist, one on bicep, with your elbow tucked in. It creates angles, stops their counterattacks, and sets up multiple kuzushi options. Wrist control alone is next. Collar tie is third. Individual fingers — never. Grabbing all four fingers for a wrist control is legitimate and strong; individual fingers just snap."},
  g_2on1:{t:"Two-on-one entry",v:"Vol 2",d:"Two primary entries: (1) take an angle and catch their wrist as they extend — most common from butterfly guard. (2) They take an angle and catch your wrist — immediately re-grip with two-on-one on them. The key detail: elbow tucked. Elbow out = they can grab your elbow and counter. Elbow in = they can't access it."},
  g_wrist:{t:"Wrist control mechanics",v:"Vol 2",d:"The gap between thumb and forefinger is the weak point of any grip. To break a grip, circle against the thumb — not against all four fingers. In closed guard the pushing/pulling approach works instead of circling. Block their wrist or bicep first, then circle. In standing, opening the range is the simplest break."},
  g_collar:{t:"Collar tie counter",v:"Vol 2",d:"If they reach for your head — intercept it. Your hands should already be in position. As they reach forward, their wrist is presented: take two-on-one. If they've already made contact and you're slow: Y-block or C-clamp behind their tricep. Get your elbow covered — if your elbow is exposed trying to grab their wrist, they just grab your elbow back."},
  g_2on1seq:{t:"Two-on-one sequence",v:"Vol 2",d:"From two-on-one: pull down on their wrist, angle your body out. This gives you an attack on their back, a collar drag, or a leg attack entry. The angle is everything — without the angle, two-on-one just becomes a hand wrestle. With the angle, their body is turned and committed."},
  g_break:{t:"Breaking grips",v:"Vol 2",d:"As Rob says, stealing a quote from Kurt Osiander: breaking grips is 'you messed up a long time ago.' The real goal is to never be in a position where you have to break grips. But when needed: circle against the thumb, block at the wrist/bicep/hip, open range and re-engage. Minimal motion — don't flare the elbow while breaking."},
  g_collarseq:{t:"Collar tie defence",v:"Vol 2",d:"They reach for your head — immediately go to two-on-one on their reaching arm. If they've made contact and you were slow: Y-block or C-clamp behind the tricep. Block their wrist to stop them following you as you circle. The principle: never just try to push a collar tie off — control the arm."},
  g_collar_drag:{t:"Collar drag",v:"Vol 2",d:"The signature gi sequence. They grab your pants — take a cross-collar grip and shift your hips. If they don't let go, they're going for a ride. Unanswered collar drag = easy score. Amplifies every kuzushi: come back to it after any forward-pull attempt. It's the base of the forward-pull direction in the alternating game."},
  g_pants:{t:"Pants and sleeve control",v:"Vol 2",d:"All the no-gi kuzushi sequences can be amplified by gi grips. Collar enables the forward-pull direction. Sleeve enables the sideways/backward direction. Always come back to collar drag after any failed kuzushi — the combination of forward + sideways keeps opponents completely off balance."},
  g_outcome:{t:"Win the hand fight",v:"Vol 2",d:"Winning = you have your grips established and they don't. You're now playing guard. Losing = they have their grips and you don't. You're now in guard retention. Every training session, every match, you're fighting for this outcome from the moment the clock starts."},
  k_entry:{t:"Seated / butterfly guard",v:"Vol 3",d:"The seated or butterfly guard is the starting point for open guard kuzushi. You're sitting up facing the kneeling or standing passer. The first read is their stance — this determines which kuzushi options you have immediately available."},
  k_square:{t:"Square stance",v:"Vol 3",d:"Both their feet are roughly level, which means both heels are equally accessible. The idiot sweep applies directly without needing an angle first. Best-case starting scenario for kuzushi from seated guard."},
  k_stagger:{t:"Staggered stance",v:"Vol 3",d:"One foot forward, one back. The back heel is too far to reach directly. You must cut an angle first — hip movement to put yourself in a position where the back heel comes into range. Then the sweep or ankle pick applies."},
  k_idiot:{t:"Idiot sweep",v:"Vol 3",d:"Named for what happens when an opponent ignores it. From square stance: push both knees simultaneously — their center of gravity goes outside their base and they fall. Works directly on inexperienced opponents. Against skilled opponents it's a probe: they'll base out, step back, or sprawl forward — each reaction feeds a follow-up."},
  k_angle:{t:"Cut angle → heel sweep or knee tap",v:"Vol 3",d:"Against staggered stance or after they've evaded the idiot sweep: cut your hip angle to get in line with their back foot. From here heel sweep (push the heel sideways), knee tap (push the knee from outside), or ankle pick become available. The angle IS the technique — without it you have no leverage on the back foot."},
  k_react:{t:"Opponent defensive reactions",v:"Vol 3",d:"Skilled opponents have four predictable responses to kuzushi: step back (creating distance), step over or hop (avoiding the leg attack), sprawl forward (using weight to crush your attack), or pull back (shortening to avoid the off-balance). Each of these reactions opens a specific counter."},
  k_stepback:{t:"Steps back",v:"Vol 3",d:"They create distance to avoid your reach. Counter: collar drag — their retreat opens range for the drag. Or ankle pick: as they step back their weight shifts to the stepping foot, making it vulnerable. Retreating is actually dangerous against a skilled collar dragger."},
  k_stepover:{t:"Steps over / hops",v:"Vol 3",d:"They hop or step over your leg to avoid the sweep. Counter: quickly recompose your hip angle to follow them. Or use collar grip to punch them backward — as they hop they momentarily lose base and a push sends them back out where you start again."},
  k_sprawl:{t:"Sprawls forward",v:"Vol 3",d:"They come forward hard to pressure you. Collar to punch them back — their weight going forward combined with collar pressure backward becomes a sweep. Or switch to a knee push in that direction since you're already braced."},
  k_pullback:{t:"Pulls away",v:"Vol 3",d:"They pull their upper body back and shorten their arms to avoid the kuzushi. The collar drag is the best answer — their backward momentum combined with collar drag forward creates a strong off-balance. Wrestling is also an option if their head drops."},
  k_anklepick:{t:"Ankle pick → wrestling up",v:"Vol 3",d:"As they step back, their feet present as ankle picks. Most BJJ practitioners don't have good wrestling but collar drag and kuzushi can set up situations where even bad wrestling becomes effective — because the opponent is already moving in the right direction."},
  k_recompose:{t:"Recompose angle",v:"Vol 3",d:"Follow their hip movement — don't stay static after a hop or step. Immediately recompose your hip angle to face them again. Then apply the same or a different kuzushi. Persistence in the engagement phase is key."},
  k_kneepush:{t:"Punch backward with collar",v:"Vol 3",d:"After they step over or sprawl forward: use the collar to punch them backward sharply. This either causes them to step back out (giving you collar drag) or resets the position. Combined with an idiot sweep it creates an alternating game."},
  k_collar_follow:{t:"Collar drag after retreat",v:"Vol 3",d:"The retreating opponent gives you collar drag for free. Their body is moving away, you pull their collar forward — they either let go (you've secured your guard position) or they face-plant (you score). The collar drag is the punctuation mark at the end of every kuzushi sequence."},
  k_recumbent:{t:"Recumbent guard kuzushi",v:"Vol 3",d:"From de la Riva / outside hook guard: use disruption at the initial engagement BEFORE being fully established in the guard system. The same kuzushi principles apply but with a hook added. Against unfamiliar opponents, the kuzushi alone scores. Against trained opponents, it draws reactions that set up the guard system."},
  k_spider:{t:"Spider / lasso tomoe nage variation",v:"Vol 3",d:"Foot on elbow from a loose spider/lasso entry. Draw knee to chest, open the elbow out first (don't push yet — premature push closes the structure). Then bridge/leg press. Even without a full bridge, if their arm is unshielded, just opening the elbow and drawing the knee creates enough force to sweep. Versatile even for non-spider players."},
  cl_entry:{t:"Closed guard starting position",v:"Vol 4",d:"Different from open guard because you can't move freely relative to your opponent. The pull-push mechanics change. You can't use hip escapes the same way. But the kuzushi principles still apply — you're just applying them through the closed guard frame."},
  cl_pull:{t:"Pulling forward with knees",v:"Vol 4",d:"The most important movement in closed guard. Critical detail: climb the guard HIGH — knees under armpits, not around the hips. Bite the heels against their lower back. Now pulling creates a lever from their spine rather than fighting their hip muscles. With sloppy guard (knees low, legs open) you'll never move a skilled opponent forward."},
  cl_posture:{t:"Posture break",v:"Vol 4",d:"Head down, one arm trapped or off-balance. Once posture is broken, their defensive options collapse. The goal of all closed guard kuzushi is to create this moment. Everything after is plugging in the appropriate attack (triangle when head dips to one side, armbar when elbow flares, omoplata when shoulder presents, scissor sweep when base is compromised)."},
  cl_danger:{t:"Counters to closed guard kuzushi",v:"Vol 4",d:"Two primary counters skilled opponents use: posting stiff-arm on your chest (blocks the pull forward) and standing/opening the guard (breaks the leg frame entirely). Each needs a specific response — just pulling harder against a stiff arm doesn't work. The lever mechanics must be adjusted."},
  cl_post:{t:"Posts on chest / stiff arms",v:"Vol 4",d:"Opponent posts stiff arms on your chest to block your pull-forward. Counter: pull their arms to one side rather than straight in. Or use their stiff-arm post as a submission entry — their straight arm is vulnerable to an armbar when they're posting. Their defense creates an attack opportunity."},
  cl_stand:{t:"Tries to stand / open guard",v:"Vol 4",d:"Opponent tries to stand up inside closed guard or create space to open it. Counter: use their rising motion to pull them back down with increased leverage — their upward momentum combined with your pull forward creates a bigger sweep than pure kuzushi alone."},
  cl_pull2:{t:"Pull + redirect sideways",v:"Vol 4",d:"When pulling straight forward is blocked: add a sideways redirect. Pull forward and slightly to the side — this creates a rotational off-balance rather than linear. Much harder to brace against. Also eliminates the headbutt risk from pulling straight forward against an aggressive opponent."},
  cl_ankle:{t:"Ankle sweep / double ankle",v:"Vol 4",d:"Feet on hips with a tomoe nage style entry. Draw opponent forward, foot on elbow, open the lever before bridging. The bridge amplifies force but isn't always needed — good lever position with a straight arm is enough to sweep. Sets up leg lock entries if they try to base out with a hand."},
  cl_score:{t:"Posture broken → attack opens",v:"Vol 4",d:"Once posture is genuinely broken — head low, balance compromised — you have a brief window where multiple attacks become available simultaneously. The key is having that attack pre-loaded. Don't break posture and then think about what to do. You need to know before the kuzushi which attack you're going to plug in."},
  t_problem:{t:"The problem — intangible skills",v:"Vol 4",d:"Grip fighting and kuzushi are considered invisible in most BJJ curriculums. They're treated as things you just pick up. This is why the standard is so low. Elite practitioners all have these skills but received them implicitly through competition, not explicit instruction. This instructional is an attempt to systematize what was previously left to osmosis."},
  t_fyjj:{t:"Fuck Your Jiu-Jitsu (FYJJ)",v:"Vol 4",d:"Constrained sparring where your partner's only job is to defend one specific thing you're working on. You have to solve it against active, intelligent resistance. The key is calibrating the difficulty — beginner partner gets to defend when the movement is 50% complete, advanced partner gets to defend at 10%. Creates skill faster than regular drilling because the resistance is live."},
  t_engage:{t:"Engagement phase game",v:"Vol 4",d:"Spar with the specific win condition of winning the hand fight. Once one person wins the grip fight, THAT person then plays their guard or their passing game — the other person defends. This makes the engagement phase the entire focal point. Forces both people to take it seriously rather than treating it as a formality before 'real' jiu-jitsu starts."},
  t_scale:{t:"Scaling difficulty to level",v:"Vol 4",d:"The FYJJ approach only works if the difficulty is calibrated. Too easy = no growth. Too hard = frustration without learning. The percentage of the movement completed before the defense is applied is the dial you turn. Same drill, wildly different difficulty. Advanced practitioners can host visiting training partners and dial in exactly the right stimulus."},
  t_beginner:{t:"White / blue belt difficulty",v:"Vol 4",d:"Let them get halfway into the movement before applying the counter. They feel the technique start to work, they feel the resistance when it's partially achieved, they can iterate. If you shut it down at 10% they never feel what success looks like and can't self-correct."},
  t_advanced:{t:"Black belt difficulty",v:"Vol 4",d:"10% of the movement before the counter. At elite level, 90% is too far gone to answer. The window is extremely tight. This forces elite practitioners to develop sharper timing, earlier reads, and more precise execution. Same drill but the constraint compresses years of development into months."},
  t_outcome:{t:"Develop self-diagnosis ability",v:"Vol 4",d:"The ultimate goal of the training methodology: practitioners who can observe what's going wrong in their own game, identify the conceptual reason, and self-correct. If you understand alignment, levers, range battles, and center of gravity — you know why a kuzushi failed and how to fix it without needing a coach to tell you."},
};

function sd(id){
  const d=D[id];if(!d)return;
  document.getElementById('dpanel').innerHTML=`<div class="dt">${d.t} <span class="dv">${d.v}</span></div><div>${d.d}</div>`;
}

function sv(v,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['concepts','grips','kuzushi','closed','training'].forEach(id=>{
    document.getElementById('v-'+id).style.display=id===v?'block':'none';
  });
  document.getElementById('dpanel').innerHTML='<div style="color:var(--color-text-secondary)">Click any node to see details from the transcripts.</div>';
}
</script>
