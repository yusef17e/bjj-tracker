<script>

  goal:    {t:"Goal: 4 dominant positions",v:"Vol 1 — Overview",d:"Danaher's entire system is built around attaining one of four dominant passing positions from half guard. He states explicitly: if you can get into any of these four, the pass becomes near-inevitable. The system is called the 4.6.3 — 4 positions, 6 skills, 3 passing families."},
  force:   {t:"1st skill: force half guard",v:"Vol 1 — Ch 3–6",d:"Rather than waiting for half guard, Danaher advocates forcing your way in. Primary methods: split squat (headquarters position), using standard open guard passes that 'accidentally' land you in half guard, and the double knee position. The key insight: half guard is safer than full guard for the passer."},
  kshield: {t:"2nd skill: clear defenses",v:"Vol 1 — Ch 8–10",d:"Three main defensive structures to clear: knee shield (most common — clear by attacking from the correct angle), scorpion/lockdown (requires specific mechanics to neutralize the leg lock), and deep half guard (opponent has gotten underneath — requires re-establishing chest-to-chest from below)."},
  c2c:     {t:"Chest-to-chest contact",v:"Vol 1 — Ch 11–13",d:"The foundational goal of half guard passing. Once chest-to-chest, establish the fundamental starting position (FSP): gripping stance, head control, hip alignment. Negate the opponent's immediate attacks — mostly underhook battles and frame creation."},
  hbfly:   {t:"Half butterfly variant",v:"Vol 5",d:"Half butterfly guard is treated as an entirely separate problem from regular half guard. The opponent has a butterfly hook inserted which changes the leverage equation. The golden rule: you cannot approach it with the same mechanics as regular half guard passing."},
  xface:   {t:"3rd skill: crossface",v:"Vol 2–3",d:"Danaher describes the crossface as perhaps the most important upper body skill in half guard passing. The crossface controls the opponent's head, which controls their spine, which controls their hips. Without it, every passing technique fails. Setting it from different upper body configurations is covered extensively in Vol 3."},
  uhood:   {t:"4th skill: underhook battle",v:"Vol 2–3",d:"The opponent's primary weapon is the underhook (whizzer). Danaher's response: either counter the underhook directly or set your own. The cliche of half guard — the athlete on bottom needs the underhook — is addressed with specific counters for each underhook variation."},
  hbgrip:  {t:"HB: upper + lower body",v:"Vol 5",d:"Half butterfly requires a completely different upper body gripping strategy. Lower body positioning is split into two long chapters — positioning 1 (feet/ankle control) and positioning 2 (advanced configurations) — each covering how to neutralize the butterfly hook without giving up passing angles."},
  freeleg: {t:"5th skill: free the knee",v:"Vol 2",d:"The trapped leg must be freed to complete the pass. Five main methods: shoelace (most fundamental), ball of foot, hand post, elbow post, square tripod. The zig-zag knee direction is a subtle but critical directional principle that multiplies the effectiveness of all five methods."},
  freeleg2:{t:"Configure the free leg",v:"Vol 4",d:"Once the knee is freed, the free leg must be configured optimally. Three configurations covered in detail. The near-side/far-side knee wedge insight: there is a crucial distinction between where the knee lands and how it creates leverage that determines pass success."},
  hball:   {t:"HB: putting it together",v:"Vol 5",d:"The synthesis chapter for half butterfly. The golden rule is applied: maintain perpendicularity while managing the butterfly hook. Upper and lower body work must integrate simultaneously — this is the final chapter of the half butterfly passing module."},
  '4dom':  {t:"4 dominant passing positions",v:"Vol 2",d:"3/4 side sit-out (very strong, often overlooked), 3/4 side (among the most powerful positions in grappling), reverse 3/4 side, and 3/4 mount. Danaher argues these four cover every realistic half guard passing scenario. The skill of moving fluidly between them is covered explicitly."},
  p1:      {t:"Half kata gatame",v:"Vol 4 — Pass 1",d:"Danaher's personal favorite. Head-arm control with the body weight applied across the head. He calls it one of the most powerful methods of passing half guard. The arm trap creates both a submission threat (arm triangle) and a structural advantage that makes the pass nearly unavoidable."},
  p2:      {t:"Lapel crossface",v:"Vol 4 — Pass 2",d:"Uses the gi lapel to enhance crossface control beyond what is possible with a standard grip. The lapel creates a rigid lever that locks the head in place while the passer completes the pass. Very effective in gi, has a modified no-gi version."},
  p3:      {t:"Top head and arm",v:"Vol 4 — Pass 3",d:"One of the most foundational passes in the sport. Danaher notes this is an 'interesting' entry — it's not the pass he personally favors but he recognizes it as fundamental curriculum. Head and arm control from above rather than the side."},
  p4:      {t:"Head block + double underhook",v:"Vol 4 — Pass 4+5",d:"Head block: Danaher's personal preference — blocking the head creates a passing angle without requiring the crossface to be set first. Double underhook: arguably the strongest passing form, incorporating all the general principles from the curriculum simultaneously."},
  law:     {t:"Law of perpendicularity",v:"Vol 2 — Final chapter",d:"The unifying principle of the entire passing system: always move perpendicular to the opponent's spine. This determines direction, explains why certain techniques work from certain positions, and resolves confusion about which way to pressure when multiple options exist."},
  pass:    {t:"Half guard passed",v:"Outcome",d:"Successful pass leads to side control, mount, or back — depending on which of the 4 dominant positions was used and which passing technique was applied. Danaher emphasizes the pass is not complete until a stable pin is established — which is why Dynamic Pinning (Vol 6–8) is the direct sequel."},
  pindef:  {t:"Theory of pinning",v:"Vol 6 — Ch 1–4",d:"Danaher defines a pin mechanically: placing wedges around the opponent's body to restrict movement. Three foundations: location of wedges (where to place them), base of support (your own stability), and inside position (the battle for wedge superiority that determines who controls the space)."},
  '3rules':{t:"3 golden rules of dynamic pinning",v:"Vol 6 — Ch 7",d:"The central thesis: no pin is perfect. Every pin has vulnerabilities. Dynamic pinning is the skill of moving between pins faster than the opponent can exploit each vulnerability. The 3 rules govern when and how to transition. The main directive: always be moving toward a better position."},
  escape:  {t:"4 lines of escape resistance",v:"Vol 6 — Ch 12–15",d:"Danaher catalogs exactly how trapped opponents escape: pushing (naive, easy to counter), shrimping (the expert escape — most dangerous to the pinner), bridging (explosive, must be anticipated and redirected), knee escape (turning up to knees — requires a specific counter-response)."},
  side:    {t:"Side pin",v:"Vol 7",d:"The most commonly achieved pin in competition. Danaher covers all major upper body configurations for side control and the corresponding lower body setups. North-south is treated as a variation within the side pin family rather than a separate category."},
  mount:   {t:"Mount",v:"Vol 7",d:"High mount, low mount, S-mount, and variation transitions are all covered. The mounted position has the highest point value in competition. The transitions from mount — particularly mount to back — are covered in the greatest depth because they represent the highest-value transition in the sport."},
  rmount:  {t:"Rear mount",v:"Vol 7–8",d:"Seatbelt grip + body triangle or leg hook configurations. Danaher argues this is the single most dominant position in Jiu-Jitsu. Retaining it is given an entire chapter in Vol 8. The lower body game (securing legs to prevent escape) is the critical skill for maintaining it."},
  't-side':{t:"Transitions from side",v:"Vol 7–8",d:"Side to mount (kneeling step over and A-sit are the two primary methods), side to knee on belly (scoring transition), side to side (non-scoring, repositioning), and side to rear mount (one of Danaher's personal favorites — uses opponent's escape attempt against them)."},
  't-mount':{t:"Transitions from mount",v:"Vol 7–8",d:"Mount to back is the marquee transition — covered in three variants: reactive (when opponent tries to escape), proactive (forcing the transition), and leg entry (more technical, bypasses certain defenses). All three are scoring transitions in competition."},
  't-rear': {t:"Transitions from rear",v:"Vol 8",d:"Rear mount to mount (the reverse transition — common when opponent defends the back), side to rear mount reactive (using opponent's bridge to take the back), and extracting the foot (the technical skill of withdrawing the hooks cleanly to reposition)."},
  diag:    {t:"Diagonal control",v:"Vol 8",d:"The minimum requirement of back control. Danaher argues most practitioners lose the back because they don't understand the diagonal principle — control must be applied across the diagonal of the opponent's body, not straight across. Without this, upper body control fails."},
  back:    {t:"Back control",v:"Vol 8",d:"Split into upper body game (seatbelt + diagonal) and lower body game (hook management and the three most important moves). Retaining the rear mount is given an entire dedicated chapter because it's the hardest dominant position to maintain despite being the most dominant."},
  retain:  {t:"Retaining and maintaining",v:"Vol 8",d:"Practical applications for mounted position maintenance and side position maintenance — real rolling scenarios where the theory is applied. The emphasis: maintaining is a skill distinct from achieving. Most practitioners achieve the position but cannot hold it because they have not practiced maintenance as a separate skill."},
  score:   {t:"Point scoring system",v:"Vol 6–7",d:"Danaher maps the entire pinning curriculum onto the competition scoring system. A key distinction: scoring transitions vs non-scoring transitions. Side to side (non-scoring) vs side to mount (scoring — 4 pts). Understanding which transitions generate points shapes the entire dynamic pinning strategy."},
};

function sd(id) {
  const d = D[id]; if(!d) return;
  document.getElementById('detail-box').innerHTML =
    `<div class="dt">${d.t} <span style="font-size:11px;font-weight:400;color:var(--color-text-secondary)">${d.v}</span></div><div>${d.d}</div>`;
}

function showView(v, btn) {
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('view-hgp').style.display = v==='hgp' ? 'block' : 'none';
  document.getElementById('view-pin').style.display = v==='pin' ? 'block' : 'none';
  document.getElementById('detail-box').innerHTML = '<div style="color:var(--color-text-secondary)">Click any node to see details from the transcripts.</div>';
}
</script>
