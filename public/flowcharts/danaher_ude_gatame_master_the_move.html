<script>
const D = {
  // SETUPS
  s_start:{t:"Bottom position vs kneeling opponent",v:"Vol 1",d:"Ude gatame is overwhelmingly a bottom-position attack. 95% of its applications come from underneath. The natural starting context is butterfly guard or open guard with the opponent on his knees in front of you, looking to engage."},
  s_goal:{t:"Goal — get hand on the mat",v:"Vol 1 Ch 2",d:"The single best setup is getting opponent's hand to the floor. Why? Because ude gatame is a STRAIGHT armlock — when his arm bears weight, it's already at breaking point. The range of motion from start to finish is tiny compared to juji gatame. No big angles, no leg movement over the head — just one motion in and you're attacking."},
  s_distance:{t:"Pick setup by distance",v:"Vol 1 Ch 2-4",d:"Three setups, three distances. Each is selected based on how close the opponent is willing to come to you. The closer he is, the easier the setup. The farther he plays, the more wrist control you need."},
  s_close:{t:"Close — head touches collarbones",v:"Vol 1 Ch 2",d:"Best case scenario — opponent lets you get your forehead into his collarbones. This gives you the easiest path to the most reliable setup: the double triceps elevator."},
  s_mid:{t:"Medium distance",v:"Vol 1 Ch 3",d:"Forehead to forehead but no further. Opponent won't let you get in deep. Underhook setup territory — work inside position rather than outside."},
  s_far:{t:"Far — low and away",v:"Vol 1 Ch 2",d:"Opponent hunkers down low, far from you. Going underneath feels impossible. This calls for wrist controls and an arm drag."},
  s_dbl:{t:"Double triceps elevator",v:"Vol 1 Ch 2",d:"The number one setup. Push head into opponent — he MUST put hands on your shoulders to push you back (or accept double underhooks). Grab both triceps. Lift — forces both hands to the mat. Even if he had inside hand position, you can pull his arms out anytime by lifting. Hand inside bicep, forward shift opposite the attacked arm."},
  s_under:{t:"Underhook setup",v:"Vol 1 Ch 3",d:"When you can't get forehead to collarbones. Put hands inside elbows, bang down on his head, snatch underhook + collar tie. Keep your elbow high (so he can't palm it out). Lift — forces hands back to mat in the same position as the double elevator finish. Then shift out."},
  s_arm:{t:"Arm drag",v:"Vol 1 Ch 4",d:"Far distance setup. Foot on opposite knee. Snap his wrist down to floor with an arm drag. As he tries to recover the arm, catch and lock. Different mechanic — using wrist control instead of underhooks — but lands you in the same attacking position."},
  s_shift:{t:"Forward shift to opposite side",v:"Vol 1 Ch 2",d:"Critical mechanic that all three setups end with. Once hands are on mat, shift forward — NOT straight down his body — to the OPPOSITE side of the attacked arm. Hand inside the bicep on the far side, elbow-to-elbow on the near side. Head higher than his head. Without this, he turns his thumb and pulls out."},
  s_attack:{t:"Sit up — attacking position",v:"Vol 1 Ch 2",d:"You're now sitting up with proper alignment: head high, his hand on mat, your hand inside his bicep, your elbow over his elbow. Ready to apply mechanics. This is the gate between setup and finishing phase."},

  // MECHANICS
  m_start:{t:"In attacking position, arm exposed",v:"Vol 1",d:"You've successfully set up the lock. His hand is on the mat (or you have wrist control). Your body is shifted. Now the question becomes: how do you finish? Two layers — upper body mechanics for the arm itself, and lower body mechanics for controlling his torso."},
  m_battle:{t:"Battle for head height",v:"Vol 1 Ch 5",d:"The central principle of ude gatame. If YOUR head is higher than HIS, you win every time. If HIS head is higher than yours, he pulls his arm free every time. All upper body mechanics ultimately serve this single goal."},
  m_upper:{t:"Upper body — 3 elements",v:"Vol 1 Ch 5-7",d:"Three mechanical elements work together: arrowhead elbow, precise placement, ear-to-elbow positioning. Plus the explosive side-to-side shift that activates them. All four must be present for a working ude gatame."},
  m_arrow:{t:"Arrowhead elbow",v:"Vol 1 Ch 5",d:"Your arm must form an arrowhead pointed at his ear. Sharply bent. The more your elbow points at his ear, the tighter the lock. The more it points away, the easier for him to raise his head and pommel out. Easiest way to enforce — use your free hand to physically grab your own elbow and pull it toward his ear."},
  m_precise:{t:"Precise placement",v:"Vol 1 Ch 5",d:"Don't put your elbow ANYWHERE on his arm — the crook of your elbow must be EXACTLY on his elbow. 2-3 inches off and the lock fails completely. This isn't splitting hairs — it's the difference between a working lock and one he twists out of. Grabbing your own elbow helps maintain this precision."},
  m_ear:{t:"Ear to elbow",v:"Vol 1 Ch 6",d:"Your head must be OFF the center line — your ear positioned directly over his forearm/elbow. If your head stays aligned with your spine on the center line, an aggressive yank breaks contact. Misalign your head — touch ear to your own shoulder — and his yank can't displace you."},
  m_shift:{t:"Explosive side-to-side shift",v:"Vol 1 Ch 7",d:"The torque that activates everything. As you feel opponent yanking back, shift your body weight EXPLOSIVELY from one side across the other. Like the torque of an engine. Doesn't need to be crazy explosive but it can't be slow — sharp, decisive movement. This shift puts pressure back on his elbow and brings his forehead to the mat."},
  m_lower:{t:"Lower body — 2 options",v:"Vol 2",d:"Two main leg configurations. The classic (legs around torso) is faster and more common in top-level competition. The advanced (knee on each shoulder) is slower to enter but provides much stronger head control. Pick based on how much time the opponent's giving you."},
  m_torso:{t:"Legs around torso",v:"Vol 2 Ch 1",d:"Least controlling but easiest and fastest. Throw your leg over his body, his torso between your two knees. Foot under far leg, other knee mid-back (or foot on far hip). This puts the upper-body burden on the elbow position — your legs only need to give a slight angle. Most competition ude gatames use this."},
  m_shoulders:{t:"Knee on each shoulder",v:"Vol 2 Ch 2",d:"Stronger but slower to enter. Wedge knees AROUND both shoulders — one in front of far shoulder, one behind near shoulder. When he tries to pull arm out, your knee stops him. When he tries to raise head, your other knee stops him. Excellent head height control. Direct control of the shoulder you're attacking."},
  m_finish:{t:"Forehead to mat",v:"Vol 3 Ch 5",d:"The unspoken goal of every good ude gatame attack. If you can put his forehead on the mat, you either get an immediate submission or such an extreme defensive reaction that you score positionally. Either outcome is a win — this becomes the bridge to the defensive reactions module."},

  // DEFENSIVE REACTIONS
  r_value:{t:"The real value of ude gatame",v:"Vol 3 Ch 1",d:"Ude gatame doesn't score the most submissions in top-level competition — kimura, juji, RNC, guillotine all outscore it. Its real value is creating strong, PREDICTABLE defensive reactions. Your opponent can't ignore an ude gatame attempt — he must react. And you can capitalize on the reaction for positional scores."},
  r_goal:{t:"Unspoken goal — forehead to mat",v:"Vol 3 Ch 5",d:"Danaher's personal insight that he says he's never heard anyone else articulate. The criterion that distinguishes successful ude gatames from failed ones is whether you can put opponent's forehead on the mat. Once forehead is down, only extreme defensive reactions can save him — and those reactions hand you positional scores."},
  r_attack:{t:"Initial ude gatame attempt",v:"Vol 3",d:"You launch your attack with the proper mechanics: arrowhead elbow, ear over elbow, explosive shift. Opponent now has to choose one of three defensive reactions. Each one opens a different counter."},
  r_yank:{t:"Reaction 1 — head up, yank arm",v:"Vol 3 Ch 1",d:"BY FAR the most common reaction. Once you've hit a couple of successful ude gatames, opponents start bringing head up, turning thumb up, twisting arm out and yanking. Standard escape — and it gives you the entry to sumi gaeshi."},
  r_pull:{t:"Reaction 2 — pull back away",v:"Vol 3 Ch 6",d:"Once you have a reputation for ude gatame, opponents will try to pull their back off the ground, lift you backwards, shorten the arms — generate distance. The reaction Danaher considers the 'heart and soul' of the video. Counter is the torque turn."},
  r_roll:{t:"Reaction 3 — roll out of lock",v:"Vol 3 Ch 7",d:"When you successfully put forehead on mat, opponent's only remaining option is to roll out. He must choose: inside shoulder (rolls into you) or outside shoulder (rolls away). Most pick outside. The rolling reaction gives you the best positional opportunities."},
  r_sumi:{t:"Sumi gaeshi sweep",v:"Vol 3 Ch 2",d:"Counter to the yank. When he yanks his arm and you feel the lock failing, CLAMP his forearm to your chest. Elbow over the forearm, other hand on his lat. Bring knees to chest — lifts him into the air so he can't base. Then tilt over with sumi gaeshi. Failed submission → successful sweep."},
  r_torque:{t:"Torque turn",v:"Vol 3 Ch 6",d:"Counter to the pull-back. Your elbow must be HIGHER than his shoulder (not just higher than his elbow). When he pulls you up, get your ear OVER his elbow — head goes off center line, locks on the arm. Now explode the opposite way, torquing his head back down to the mat. Failed defense → submission."},
  r_pursuit:{t:"Pursuit by shoulder",v:"Vol 3 Ch 7",d:"Counter to the roll-out. Watch which shoulder he rolls over. Inside shoulder rolls bring him into you (easy follow-up). Outside shoulder rolls take him away. Either way, since his head is now lower than yours, you have the angle advantage to take top position."},
  r_sumi2:{t:"→ Top position (2 points)",v:"Vol 3 Ch 1",d:"After sumi gaeshi, you end up on top of him in a scrambled but dominant position. 2 positional points. Better still — your sumi gaeshi forces his hand back to the mat, restarting the ude gatame attack. One-two punch."},
  r_torque2:{t:"→ Submission (or forehead on mat)",v:"Vol 3 Ch 6",d:"The torque turn brings his head back to the mat with you in better position than the original attempt. Either he taps immediately, or he tries reaction 3 (rolling) — and you flow into pursuit."},
  r_pursuit2:{t:"→ Mount / side / back",v:"Vol 3 Ch 7",d:"After the roll, follow him. Foot across hips for mount. Or knee on belly / side control if he rolled across shoulders away. Against elite opponents, wrestle your way up — double leg if his head is higher, snap down and go behind if his head is lower. The cue is always: forehead on mat → he rolls → you take position."},
  r_shoulder:{t:"Reaction 3 expanded — which shoulder rolls?",v:"Vol 3 Ch 7",d:"Once forehead is on mat, opponent must roll. He has TWO shoulders to choose from. Your response differs significantly depending on which one. Knowing both options in advance lets you score against either choice."},
  r_inside:{t:"Inside shoulder — slow roll",v:"Vol 3 Ch 7",d:"He rolls over the inside shoulder (the one closer to you). Always a slower roll because he tends to get bound up on it. Rolls INTO you. Easy break if he's willing to take it — even if not, easy to throw a leg over his hips to mount."},
  r_outside:{t:"Outside shoulder — away",v:"Vol 3 Ch 7",d:"Smart opponents pick this — generates distance. Either a forward roll (more distance) or a sideways roll across the shoulder blades. You can't predict which, so be ready for both. His head is now lower than yours — angle advantage stays with you."},
  r_mount:{t:"Easy mount or break",v:"Vol 3 Ch 7",d:"Against the inside shoulder roll, you stay tight and either finish the broken arm or simply mount up. He rolled toward you, so the leg has minimal distance to travel. Highest-percentage positional outcome."},
  r_split:{t:"Forward roll or sideways",v:"Vol 3 Ch 7",d:"Outside shoulder roll splits into two sub-paths. Forward roll = more distance for you to chase. Sideways across shoulder blades = he ends up flat on his back further away. Both lead to you taking dominant position but via different routes."},
  r_kob:{t:"Side or knee on belly",v:"Vol 3 Ch 7",d:"After he completes the outside roll: come up to side control or knee on belly on the far side of his body. Against elite opponents who manage to scramble up before you can pin, switch to wrestling — double leg if head is higher, snap-down and back take if head is lower."},

  // RELATIONSHIPS
  x_center:{t:"Ude gatame — center of the system",v:"All volumes",d:"Ude gatame isn't a standalone technique — it's the hub of an interconnected system. Every other arm attack and even leg attacks chain into and out of it. Master ude gatame and you master a half-dozen related submissions simultaneously."},
  x_juji:{t:"Juji gatame",v:"Vol 4 Ch 1-3",d:"When your opponent's arm rotates out of ude gatame to escape, the rotation feeds directly into juji gatame. Three main bridges: ude gatame from half guard → juji, ude gatame into rolling juji gatame, ude gatame into shoulder crunch juji. Ude gatame is straight, juji is the same arm at a different angle — the transition is seamless."},
  x_kimura:{t:"Kimura",v:"Vol 4 Ch 5-7",d:"When opponent's arm BENDS under ude gatame pressure (a natural defensive reaction to relieve straight-arm tension), it bends right into kimura position. Hand-over-hand ude gatame is the bridge variation — somewhere between an ude gatame and a kimura. The two locks share so much positioning that switching mid-attack is effortless."},
  x_te:{t:"Te gatame",v:"Vol 4 Ch 8 + Vol 5",d:"A sub-variation of ude gatame using overhook control instead of underhook. The hand is caught high in your armpit (find the bony growth — not low on wrist). Break the elbow with your HIPS and LEGS rather than upper body. Hand functions as a wedge in your hip pocket. Different mechanics, same goal — straight armlock."},
  x_ashi:{t:"Ashi garami",v:"Vol 6 Ch 2",d:"The upper body/lower body pairing that lets you dominate match tempo. Rule: when opponent's HANDS go on the mat, attack ude gatame. When his KNEES come off the mat, attack ashi garami. Each defense of one gives you the other. Distance-of-hips also dictates choice — hips far from yours = ude gatame, hips over yours = ashi garami."},
  x_top:{t:"From top position",v:"Vol 6 Ch 1",d:"95% of ude gatames come from bottom. The exception: from chest-to-chest top side control, when opponent defends with forearm in your hip and posted hand. Shift chest-to-stomach, get elbow next to his elbow, capture the tricep tendon. Deep-V grip or figure-4 grip. Only top ude gatame Danaher recommends — most others sacrifice chest-to-chest contact and aren't worth the risk."},
  x_bottom:{t:"95% from bottom position",v:"Vol 6 Ch 1",d:"Danaher's philosophy: ude gatame is fundamentally a bottom-position attack. Setups are easy from below (just need a hand on the mat), execution is fast, and the move scares opponents from even reaching toward you. Most top-position ude gatames are Hail Mary moves — stick with juji gatame, strangles, back attacks, guillotines from top."},
};

function sd(id){
  const d=D[id];if(!d)return;
  document.getElementById('detail-box').innerHTML=`<div class="dt">${d.t} <span class="dv">${d.v}</span></div><div>${d.d}</div>`;
}

function showView(v,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['setups','mechanics','reactions','relations'].forEach(id=>{
    document.getElementById('view-'+id).style.display=id===v?'block':'none';
  });
  document.getElementById('detail-box').innerHTML='<div style="color:var(--color-text-secondary)">Click any node to see details from the transcripts.</div>';
}
</script>
