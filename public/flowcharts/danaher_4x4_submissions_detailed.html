
<style>
*{box-sizing:border-box;margin:0;padding:0}
.tab-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:6px 14px;border-radius:8px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit}

.ld{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.detail{border:0.5px solid var(--color-border-tertiary);border-radius:10px;padding:14px 18px;margin-top:12px;background:var(--color-background-secondary);font-size:13px;color:var(--color-text-secondary);line-height:1.65;min-height:60px}
.detail .dt{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px}
.detail .dv{font-size:11px;color:var(--color-text-secondary);font-weight:400}
svg{display:block;width:100%}
</style>

<div class="tab-bar">
  <button class="tab active" onclick="showView('kata',this)">Kata gatame</button>
  <button class="tab" onclick="showView('rear',this)">Rear strangle</button>
  <button class="tab" onclick="showView('juji',this)">Juji gatame</button>
  <button class="tab" onclick="showView('tri',this)">Mounted triangle</button>
</div>

<div class="legend">

</div>

<script>
const D = {
  // KATA GATAME
  k_start:{t:"Single chest wrap established",v:"Vol 3 → Vol 4",d:"Starting position for all kata gatame attempts. You have one of opponent's arms trapped chest-to-chest, but their hand is still behind your back. From here, the shoulder shrug converts the position into something workable. Kata gatame is always Danaher's first submission choice — least risk, highest percentage, body stays connected throughout."},
  k_shrug:{t:"Shoulder shrug",v:"Vol 4 Ch 2",d:"Critical first move. Do NOT drive forward — that won't clear the arm. Instead: look to the OTHER side of his head, push toward the center line, drop your shoulder to the floor. This shrugs his hand from behind your back to in front of your face. Without this, no kata gatame is possible from chest wrap."},
  k_high:{t:"Slide feet to high mount",v:"Vol 4 Ch 2",d:"After shrugging, slide feet up high on the body. This compresses opponent's breathing — they can't elbow escape effectively when oxygen is restricted. Even expert opponents make mistakes when they can't breathe. Critical: this is a temporary migration UP the body — you'll migrate back DOWN to finish."},
  k_jaw:{t:"Trap tricep with jaw",v:"Vol 4 Ch 2",d:"Look BACK (not forward) to hook your jaw outside his tricep. Critical — if you look forward, you'll never trap the arm. Only after jaw is locked do you release your arms to thumb-post and lock the position. The jaw holds his arm in place while you set up the strangle."},
  k_lift:{t:"Lift opponent's head off the mat",v:"Vol 4 Ch 4",d:"The single most important universal principle of the entire 4-submission system. When head is on mat, you cannot get optimal elbow position. Lifting creates space to shoot your elbow behind his neck. This applies to ALL 4 submissions, not just kata gatame."},
  k_pump:{t:"Pump flex method",v:"Vol 4 Ch 4",d:"After lifting head: hold his shoulder, push with other hand on the floor, flex bicep to walk elbow further around. The pumping action progressively gets the elbow deeper behind the neck. Allows you to get your hand above his shoulder — critical, because if hands lock UNDER the shoulder, the strangle is always weak."},
  k_pull:{t:"Elbow pull method",v:"Vol 4 Ch 4",d:"Alternative to pump flex. After lifting head, physically grab your own elbow with your other hand and pull it into position. Same goal — get the elbow behind the spine. Easier than pump flex for some body types. Both methods achieve identical end position."},
  k_3keys:{t:"Three mechanical positions",v:"Vol 4 Ch 3",d:"The three non-negotiable positions for a working kata gatame: (1) Your elbow as far behind his spine as possible — the deeper, the tighter. (2) Your thumb high on top of his shoulder, near the front deltoid — not falling behind. (3) Your forehead glued temple-to-temple with his. Miss any of these and the strangle weakens."},
  k_shoulder:{t:"Shoulder below chin",v:"Vol 4 Ch 3",d:"The MOST common kata gatame mistake: shoulder on cheek instead of under chin. Your shoulder must be BELOW the chin to make contact with the near carotid artery. Trick: aim your right shoulder INTO his right armpit. You can't actually get there, but trying naturally drops your shoulder below his jaw line."},
  k_dismount:{t:"Dismount when forehead is on mat",v:"Vol 4 Ch 7",d:"The cue for safe dismount: your forehead must be on the mat. Why? Forehead pressure locks his elbow in place — he can't bridge or pull arm free. Without forehead on mat, bridging easily frees his elbow. Dismount: knee wedges at his hip (stops walking escape), other leg sprawls flat to bring weight down."},
  k_direction:{t:"Rotational finish",v:"Vol 4 Ch 3",d:"Kata gatame is a ROTATIONAL strangle, not a linear push. Drive in the direction his elbow is pointing — like you're a clock hand turning around his neck. Pull YOUR right elbow up toward your sternum (the strangle power). Most people drive linearly down the centerline — that's a neck crank, not a strangle."},
  k_defense:{t:"Bulldoze through 4 defenses",v:"Vol 4 Ch 5",d:"Four standard defenses, all defeated by proper mechanics: (1) hand on side of head — drive crown of head under his hand and rotate. (2) locked hands — plant head, raise elbow. (3) locked hands + bridge — drive across him to keep elbow under crown of head. (4) elbow above crown of head — get out to side first, drive across."},
  k_fail:{t:"Recovery from failed kata gatame",v:"Vol 4 Ch 6",d:"Failures happen — recognize early signs: squeeze without effect, or elbow slipping over crown. Never abandon to a weird side position. Instead: tripod up, drive knee in front of his hip, walk across his body, slap back into mount. You lost the kata gatame but kept the mount — restart the entire attack sequence."},

  // REAR STRANGLE
  r_start:{t:"Single chest wrap attempted",v:"Vol 5 Ch 1",d:"You've gone through steps 1-3 of the 4×4 system and reached the single chest wrap. The natural next move is to shrug the arm forward into kata gatame position. But sometimes that shrug just doesn't work — opponent is too strong or arms too long. This is when the rear strangle path opens up."},
  r_fail:{t:"Shrug fails — switch systems",v:"Vol 5 Ch 1",d:"When you've tried your best to shrug the arm forward and the opponent's arm is too long or they're flexing too hard, you don't force it. The system has a built-in alternative: convert the chest wrap into a far trap underhook. This redirects the entire attack toward rear mount instead of kata gatame."},
  r_grip:{t:"Grip far trapezius / neck muscle",v:"Vol 5 Ch 1",d:"Remove the chest wrap and hook your training partner at the far trapezius and neck muscle, deflexing outward. You now have an underhook plus a grip anchored to his head. This combination is the foundation of the entire rear mount transition — your hand functions as a steering wheel for his upper body."},
  r_roll:{t:"Roll across his tricep",v:"Vol 5 Ch 1",d:"With the far trap grip established, roll across his tricep. Your chest ends up behind his tricep. This puts mechanical pressure on him and forces partial turning of his back. If he tries to turn back into you from here, it's very difficult — the leverage is already against him."},
  r_wrist:{t:"Seize wrist, pull forward",v:"Vol 5 Ch 1",d:"Lock onto his wrist and pull everything forward. Your chest seals against the back of his tricep. Now when he tries to bring his arm back to escape, it's well-nigh impossible. The combination of head control + wrist control + chest behind tricep creates a near-irreversible commitment to his back."},
  r_bridge:{t:"Opponent bridges away",v:"Vol 5 Ch 1",d:"The only realistic escape attempt remaining: opponent bridges over their right shoulder, hoping to bring elbow back and recover. This isn't actually a problem — it's the move that completes the transition for you. Their bridge gives you the angle and momentum to fully take the back."},
  r_stay:{t:"Opponent stays flat",v:"Vol 5 Ch 1",d:"Less common but possible — opponent doesn't bridge, just tries to hold position. Maintain the chest-behind-tricep pressure. Keep advancing the head control and wrist control. Eventually they must move, and any movement opens the path to the claw grip."},
  r_claw:{t:"Take claw grip on neck",v:"Vol 5 Ch 1",d:"As he commits to the bridge/turn, slip your chest behind him and take a claw grip on his neck. Critical: head DOWN, not up. If your head is up while he gets his back to the floor, he can recover. Punch your foot up to his hip and fill the space with your knees to prevent him getting his back flat."},
  r_lock:{t:"Lock figure-4 / body triangle",v:"Vol 5 Ch 1",d:"Once behind, pull down toward the mat and lock figure-4 with the legs (body triangle). If opponent is thick through the waist or your legs are short, go foot-to-foot instead. Conventional rear mount with seatbelt also works. The exact lower body lock depends on body proportions."},
  r_finish:{t:"Rear strangle finish",v:"Vol 5",d:"From rear mount, finish with rear-naked strangle. The 'lifting the head' principle applies here too — lift his head off the floor during the seatbelt-to-strangle transition for a stronger grip and easier finish."},

  // JUJI GATAME
  j_start:{t:"Double arm wrap from mount",v:"Vol 5 Ch 8",d:"The double arm wrap is the BEST setup for mounted juji gatame. Better than single chest wrap because it puts both opponent's arms in a controlled pocket. From here you can attack either arm with juji, but typically focus on the arm with worse defensive position."},
  j_lift:{t:"Lift the head first",v:"Vol 5 Ch 9",d:"Universal entry key — same as kata gatame. Lifting the head exposes the arm and gives you the room to swing your leg over to set up the armbar. When head is on the mat, you can only get duct-tape juji gatames — never proper position."},
  j_rule:{t:"Right-right-right rule",v:"Vol 5 Ch 11",d:"The single most important positional rule for juji gatame. For a right-side armbar: his RIGHT elbow must be over your RIGHT hip, AND his right hand must be over your right shoulder. If either alignment is off, the lock will fail. The rule is symmetric — left-left-left for left-side armbars."},
  j_configs:{t:"Multiple juji configurations",v:"Vol 6 Ch 3",d:"Danaher's central juji insight: it's not ONE armbar, it's a system of related armbars. Your opponent will defend in different ways — flex hard, turn out, sit up, run away. Each defense opens a different juji variation. Having only one juji = blue belt level. Multiple jujis = high-level competitor."},
  j_open:{t:"Open juji",v:"Vol 6 Ch 3",d:"The standard juji gatame from day one of training. Feet open around his secondary arm. Good for most beginners and mid-skill opponents. The 'default' starting point of the juji system — when in doubt, start here."},
  j_closed:{t:"Closed juji",v:"Vol 6 Ch 3",d:"Crucial variation. Draw his secondary arm in, lock your feet around it (like inside a closed guard). Knees FLARED (not squeezed — squeezing loses hip control). Feet pull back. Use when opponent goes to hit a turning escape — closed legs hold him in place. Also strong for hand-grip control and breaking pressure with the legs."},
  j_force:{t:"Standard pull finish",v:"Vol 6 Ch 1",d:"Classic juji finish — grab opponent's wrist and pull it to your shoulder, elbow over the hip fulcrum. Works at most levels. But against tough, fire-and-brimstone opponents who refuse to tap, you'll run out of pulling range when his wrist hits your chest. Time to switch to magnum finishes."},
  j_magnum:{t:"Magnum finishes",v:"Vol 6 Ch 1-2",d:"For opponents willing to take damage rather than tap. Two primary magnum methods: pushing finish and lat grip. Both amplify breaking power significantly beyond standard pulls. Use when standard finish produces 'pop' sounds but no tap, or when you can feel they're willing to suffer arm damage to escape."},
  j_push:{t:"Pushing finish",v:"Vol 6 Ch 1",d:"Turn onto a single hip (easy — opponent usually rotates out anyway, follow them). Switch your grip from pulling to pushing. Close your knee down over his arm. Push his wrist over the fork of your hip. Pushing generates far more leverage than pulling because your own chest doesn't get in the way."},
  j_lat:{t:"Lat grip finish",v:"Vol 6 Ch 2",d:"Take his hand BEHIND your back, locked into your lat muscle. Don't try to move his hand — move yourself in front of his fist. Pull his pinky to your shoulder, then lock his triceps behind your tricep. Hand locks to own side. Robs all his defenses — can't rejoin hands, can't rotate out."},
  j_pushdetail:{t:"Knee closes over arm",v:"Vol 6 Ch 1",d:"After turning to single hip and getting the push position, close your knee down over his arm. As he tries to work out, push his wrist further over the fork of the hip. The hip BONE (not soft inner thigh) is the fulcrum — that's why hardness matters. Inner thighs are too soft to break against."},
  j_latdetail:{t:"Robs his defenses",v:"Vol 6 Ch 2",d:"The lat grip is genuinely brutal because it removes both standard juji defenses simultaneously: opponent can't rejoin his hands (they're separated by your body) and can't rotate out (his hand is trapped behind your back). Lean into it for the break — minimal effort, maximum effect."},

  // MOUNTED TRIANGLE
  t_start:{t:"Mounted, ready to attack triangle",v:"Vol 7",d:"Hardest sell of the 4 submissions because you're trading dominant top position for potentially landing on bottom. Danaher's argument: long-term, your legs fighting his hands is the ultimate leverage advantage. The 4 keys and 3 rules of risk are designed to make this commitment safe."},
  t_4keys:{t:"4 keys to a strong mounted triangle",v:"Vol 7 Ch 1-4",d:"All four must be present for confident attacks: hand assist, forward bias, head off mat twice, rules of risk. Missing any of these makes the move unreliable. This is the entire pre-game checklist before committing to any mounted triangle attempt."},
  t_k1:{t:"Hand assist",v:"Vol 7 Ch 1",d:"Always lift his head and grab your own ankle when stepping over. Your hand replaces what will later become your leg — closes the wedge around his head and arm. Without it, he yanks his elbow free and your triangle is gone. With it, the wedge is closed even before you lock the figure-4. Also pulls your foot to the correct position (in FRONT of the deltoid, not over the shoulder blades)."},
  t_k2:{t:"Forward bias",v:"Vol 7 Ch 2",d:"Never lean back when locking. Forward bias does two things: gets his head off the mat AND gets your foot off the mat — both critical for locking. If his head is on the mat and your foot is on the mat, locking the triangle is a nightmare. Lean forward, both come up naturally, locking becomes effortless."},
  t_k3:{t:"Get opponent's head off the mat — twice",v:"Vol 7 Ch 3",d:"Two lifts required: first to enter (creates space to slip leg behind neck), second to lock (exposes your own foot to figure-4). Same universal principle as kata/juji/rear — head on mat = nothing works. Head off mat = everything works. Critical insight."},
  t_k4:{t:"Rules of risk",v:"Vol 7 Ch 4",d:"Three specific positional conditions under which it's safe to commit your back to the ground. Without one of these conditions present, do NOT commit. With any one present, you can fearlessly go to your back because top-vs-bottom position becomes irrelevant — you'll finish either way."},
  t_methods:{t:"Entry methods",v:"Vol 7 Ch 5-8",d:"Two main families: stepover methods (push-down and push-out variants — industry standard, fastest) and knee slide methods (Danaher's preferred — tighter in practice). Choose based on which family fits your body type and which opening the opponent gives you."},
  t_pushdown:{t:"Push-down stepover",v:"Vol 7 Ch 5",d:"The most well-known and commonly used method. Take top hand position on opponent's wrist, stuff it down to his chest. Come up to high hip position. Throw leg over while pulling up on head. Lock figure-4. Used by virtually everyone teaching mounted triangle — solid foundational method."},
  t_pushout:{t:"Push-out stepover",v:"Vol 7 Ch 6",d:"Take INSIDE hand position (between his head and arm). Lift opponent's elbow, push wrist OUTWARD instead of down. Works against weak rotator cuff muscles. Lift head, slide leg over the gap between his head and arm. Elbow goes behind his head before stepping over — without this, he bridges and your hand assist fails."},
  t_kneeslide:{t:"Knee slide method (preferred)",v:"Vol 7 Ch 7",d:"Danaher's personal preference. Inherently tighter in practice than stepover methods. The pivot knee slide method is his favorite. Trade-off: slower setup, but resulting triangle is more secure with less risk of opponent escaping during the entry sequence."},
  t_risk:{t:"3 rules of risk",v:"Vol 7 Ch 4",d:"The framework that makes mounted triangle psychologically safe to commit to. Each rule defines a specific position-state where falling to your back is fine. Outside these conditions, don't commit to your back. Inside any one of them, top-vs-bottom doesn't matter — finish is inevitable either way."},
  t_r1:{t:"Rule 1: Full figure-4 locked",v:"Vol 7 Ch 4",d:"Highest confidence level. Shoelaces in the pocket of the knee, legs back-heeling strongly. If this is locked, you don't care if your back touches the ground — finish is guaranteed. Most opponents tap before you even need to roll. Standard for high-level competition."},
  t_r2:{t:"Rule 2: Hand assist in place",v:"Vol 7 Ch 4",d:"Almost as good as Rule 1. You don't have figure-4 locked, but you're holding your own ankle. Closed wedge around his head and arm. If he takes you over, your hand keeps the structure intact long enough to lock the figure-4 from the bottom. High confidence to commit."},
  t_r3:{t:"Rule 3: Lat grip on arm",v:"Vol 7 Ch 4",d:"No figure-4, no hand assist, maybe even head still on mat — but his arm is trapped behind your lat. Creates a perfect dilemma: if he stacks you, he gives you the triangle; if he yanks out, he gives you a lat 3/4 juji gatame. Either response feeds you a submission. Commit to back fearlessly."},
  t_lock:{t:"Lock the figure-4 and finish",v:"Vol 7 Ch 5",d:"Once committed: forehead to mat (locks the structure, prevents bridge escape), back-heel both legs (tightens the triangle), strangle. If you're balanced over his chest and head with forward bias, the finish is mechanical — minimal effort required."},
  t_topbottom:{t:"Roll forward if needed — never backward",v:"Vol 7 Ch 5",d:"If opponent is so explosive he rolls you, ALWAYS roll forward — never backward. Forward roll keeps the figure-4 intact and finishes you in side-control style top position. Backward roll loses everything. The forward bias from key #2 makes this natural — backward roll only happens if you violated forward bias."},
};

function sd(id){
  const d=D[id];if(!d)return;
  document.getElementById('detail-box').innerHTML=`<div class="dt">${d.t} <span class="dv">${d.v}</span></div><div>${d.d}</div>`;
}

function showView(v,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['kata','rear','juji','tri'].forEach(id=>{
    document.getElementById('view-'+id).style.display=id===v?'block':'none';
  });
  document.getElementById('detail-box').innerHTML='<div style="color:var(--color-text-secondary)">Click any node to see details from the transcripts.</div>';
}
</script>
